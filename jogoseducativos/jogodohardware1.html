        /* Animações simples para transições mais suaves */
        .fade-in {

        }

            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .option-btn {
            transition: all 0.2s ease;
        }
        .option-btn:hover:not(:disabled) {
            transform: translateY(-2px);

            border-color: #22c55e !important;
        }
        .wrong-answer {

            color: white !important;
            border-color: #ef4444 !important;
        }

        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        // Variáveis de estado do jogo
        let quizData = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let canAnswer = true;

        // Elementos do DOM
        const startScreen = document.getElementById('start-screen');
        const quizScreen = document.getElementById('quiz-screen');
        const resultScreen = document.getElementById('result-screen');
        const progressContainer = document.getElementById('progress-container');
        const progressBar = document.getElementById('progress-bar');
        
        function startGame() {
            // Prepara as perguntas (Sorteio) para esta ronda
            quizData = shuffleArray(allQuizData);
            
            startScreen.classList.add('hidden');
            quizScreen.classList.remove('hidden');
            quizScreen.classList.add('fade-in');
            progressContainer.classList.remove('hidden');
            
            currentQuestionIndex = 0;
            score = 0;
            updateScoreDisplay();
            loadQuestion();
        }

        function loadQuestion() {
            canAnswer = true;
            const currentData = quizData[currentQuestionIndex];
            
            // Atualizar contadores e barra de progresso
            document.getElementById('question-counter').innerText = `Pergunta ${currentQuestionIndex + 1} de ${quizData.length}`;
            const progress = ((currentQuestionIndex) / quizData.length) * 100;
            progressBar.style.width = `${progress}%`;

            // Carregar conteúdo da pergunta
            document.getElementById('question-text').innerText = currentData.question;
            
            const imgElement = document.getElementById('question-image');
            const loadingElement = document.getElementById('img-loading');
            
            // Estado inicial da imagem enquanto carrega
            imgElement.classList.add('hidden');
            loadingElement.classList.remove('hidden');
            imgElement.src = ''; // Limpar anterior para evitar piscares
            
            // Pré-carregamento robusto via JavaScript
            const bgImage = new Image();
            bgImage.onload = function() {
                imgElement.src = currentData.image;
                imgElement.classList.remove('hidden');
                loadingElement.classList.add('hidden');
            };
            bgImage.onerror = function() {
                // Em caso de falha absoluta da internet, cria um cartão de recurso com o nome e ícone garantido localmente
                imgElement.src = createFallbackImage(currentData.deviceName, currentData.emoji);
                imgElement.classList.remove('hidden');
                loadingElement.classList.add('hidden');
            };
            bgImage.src = currentData.image;

            // Gerar botões de opções
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = ''; // Limpar opções anteriores
            
            currentData.options.forEach((option, index) => {
                const button = document.createElement('button');
                button.innerText = option;
                // Classes base do botão
                button.className = 'option-btn border-2 border-slate-200 text-slate-700 bg-white hover:bg-slate-50 hover:border-blue-300 font-semibold py-4 px-6 rounded-xl text-left w-full focus:outline-none';
                button.onclick = () => selectAnswer(index, button);
                optionsContainer.appendChild(button);
            });

            // Adicionar animação ao ecrã
            quizScreen.classList.remove('fade-in');
            void quizScreen.offsetWidth; // Trigger reflow
            quizScreen.classList.add('fade-in');
        }

        function selectAnswer(selectedIndex, selectedButton) {
            if (!canAnswer) return;
            canAnswer = false; // Bloqueia múltiplos cliques

            const currentData = quizData[currentQuestionIndex];
            const isCorrect = selectedIndex === currentData.correctAnswer;
            const allButtons = document.querySelectorAll('.option-btn');

            if (isCorrect) {
                score++;
                updateScoreDisplay();
                selectedButton.classList.add('correct-answer');
                // Efeito sonoro simples ou feedback visual
                selectedButton.innerHTML += ' <span class="float-right">✅</span>';
            } else {
                selectedButton.classList.add('wrong-answer');
                selectedButton.innerHTML += ' <span class="float-right">❌</span>';
                // Destacar a resposta correta
                allButtons[currentData.correctAnswer].classList.add('correct-answer');
            }

            // Desativar todos os botões
            allButtons.forEach(btn => btn.disabled = true);

            // Aguardar um pouco antes da próxima pergunta
            setTimeout(() => {
                currentQuestionIndex++;
                if (currentQuestionIndex < quizData.length) {
                    loadQuestion();
                } else {
                    showResults();
                }
            }, 2000); // 2 segundos de pausa para ver a resposta correta
        }

        function updateScoreDisplay() {
            document.getElementById('score-display').innerText = `Pontos: ${score}`;
        }

        function showResults() {
            quizScreen.classList.add('hidden');
            resultScreen.classList.remove('hidden');
            resultScreen.classList.add('fade-in');
            progressContainer.classList.add('hidden');

            document.getElementById('final-score').innerText = score;
            document.getElementById('total-questions').innerText = quizData.length;

            const percentage = (score / quizData.length) * 100;
            const feedbackElement = document.getElementById('feedback-message');
            const iconElement = document.getElementById('result-icon');

            if (percentage === 100) {
                feedbackElement.innerHTML = "Excelente! Tens um conhecimento perfeito sobre hardware!";
                feedbackElement.className = "p-4 rounded-xl mb-8 font-medium bg-green-100 text-green-800";
                iconElement.innerHTML = "🏆";
                iconElement.className = "w-24 h-24 mx-auto mb-6 rounded-full flex items-center justify-center text-5xl bg-yellow-100";
            } else if (percentage >= 70) {
                feedbackElement.innerHTML = "Muito bem! Dominas a maioria dos conceitos de periféricos.";
                feedbackElement.className = "p-4 rounded-xl mb-8 font-medium bg-blue-100 text-blue-800";
                iconElement.innerHTML = "🌟";
                iconElement.className = "w-24 h-24 mx-auto mb-6 rounded-full flex items-center justify-center text-5xl bg-blue-100";
            } else if (percentage >= 50) {
                feedbackElement.innerHTML = "Bom esforço! Mas ainda podes rever algumas definições do cartaz.";
                feedbackElement.className = "p-4 rounded-xl mb-8 font-medium bg-yellow-100 text-yellow-800";
                iconElement.innerHTML = "👍";
                iconElement.className = "w-24 h-24 mx-auto mb-6 rounded-full flex items-center justify-center text-5xl bg-yellow-100";
            } else {
                feedbackElement.innerHTML = "Precisa de estudo! Revê o cartaz sobre as entradas, saídas e armazenamento.";
                feedbackElement.className = "p-4 rounded-xl mb-8 font-medium bg-red-100 text-red-800";
                iconElement.innerHTML = "📚";
                iconElement.className = "w-24 h-24 mx-auto mb-6 rounded-full flex items-center justify-center text-5xl bg-red-100";
            }
        }

        function restartGame() {
            resultScreen.classList.add('hidden');
            startGame();
        }
    </script>
</body>
</html>
