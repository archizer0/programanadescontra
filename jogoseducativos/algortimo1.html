    <style>
        @keyframes fade-in {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fade-in 0.5s ease-out forwards; }
        
        @keyframes slide-up {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-slide-up { animation: slide-up 0.4s ease-out forwards; }
        
        @keyframes pulse-fast {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .animate-pulse-fast { animation: pulse-fast 1.5s infinite; }

        @keyframes wiggle {
            0%, 100% { transform: rotate(-10deg); }
            50% { transform: rotate(10deg); }
        }
        .animate-wiggle { animation: wiggle 1.5s ease-in-out infinite; }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .animate-float { animation: float 2s ease-in-out infinite; }
        
        @keyframes drip {
            0% { transform: translateY(-15px); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(15px); opacity: 0; }
        }
        .animate-drip { animation: drip 1.5s infinite linear; }
    </style>
</head>

            scenarios: { lvl1: 0, lvl2: 0, lvl3: 0, lvl4: 0, lvl5: 0 },

            lvl1: { seq: [], shuffledOps: [], status: '' },
            lvl2: { seq: [], shuffledOps: [], status: '' },
            lvl3: { status: '' },
            lvl4: { status: '' },
            lvl5: { seq: [], shuffledOps: [], status: '' }
        };

        // --- FUNÇÕES UTILITÁRIAS ---
        function shuffle(array) {
            let curId = array.length;
            while (0 !== curId) {
                let randId = Math.floor(Math.random() * curId);
                curId -= 1;
                let tmp = array[curId];
                array[curId] = array[randId];
                array[randId] = tmp;
            }
            return array;
        }

        function initGame() {
            State.scenarios.lvl1 = Math.floor(Math.random() * Scenarios.lvl1.length);
            State.scenarios.lvl2 = Math.floor(Math.random() * Scenarios.lvl2.length);
            State.scenarios.lvl3 = Math.floor(Math.random() * Scenarios.lvl3.length);
            State.scenarios.lvl4 = Math.floor(Math.random() * Scenarios.lvl4.length);
            State.scenarios.lvl5 = Math.floor(Math.random() * Scenarios.lvl5.length);

            State.lvl1.seq = []; State.lvl1.status = '';
            State.lvl1.shuffledOps = shuffle([...Scenarios.lvl1[State.scenarios.lvl1].ops]);

            State.lvl2.seq = []; State.lvl2.status = '';
            State.lvl2.shuffledOps = shuffle([...Scenarios.lvl2[State.scenarios.lvl2].ops]);

            State.lvl3.status = '';
            State.lvl4.status = '';
            
            State.lvl5.seq = []; State.lvl5.status = '';
            State.lvl5.shuffledOps = shuffle([...Scenarios.lvl5[State.scenarios.lvl5].ops]);

            State.view = 'intro';
            render();
        }

        function setView(view) {
            State.view = view;
            render();
        }

        function updateRobotName(val) {
            State.robotName = val || 'BipBop';
        }

        function parseText(text) {
            return text.replace(/{robot}/g, `<b>${State.robotName}</b>`);
        }

        // --- AÇÕES DOS NÍVEIS ---
        function clickLvl1(id) {
            if (State.lvl1.seq.includes(id) || State.lvl1.status === 'success') return;
            State.lvl1.seq.push(id);
            if (State.lvl1.seq.length === 4) {
                if (State.lvl1.seq[0]==='s1' && State.lvl1.seq[1]==='s2' && State.lvl1.seq[2]==='s3' && State.lvl1.seq[3]==='s4') {
                    State.lvl1.status = 'success';
                } else {
                    State.lvl1.status = 'error';
                }
            }
            render();
        }
        function resetLvl1() { State.lvl1.seq = []; State.lvl1.status = ''; render(); }

        function clickLvl2(id) {
            if (State.lvl2.seq.includes(id) || State.lvl2.status === 'success') return;
            State.lvl2.seq.push(id);
            if (State.lvl2.seq.length === 3) {
                if (State.lvl2.seq[0] === 's1' && State.lvl2.seq[1] === 's2' && State.lvl2.seq[2] === 's3') {
                    State.lvl2.status = 'success';
                } else {
                    State.lvl2.status = 'error';
                }
            }
            render();
        }
        function resetLvl2() { State.lvl2.seq = []; State.lvl2.status = ''; render(); }

        function clickLvl3(status) { State.lvl3.status = status; render(); }
        function clickLvl4(status) { State.lvl4.status = status; render(); }

        function clickLvl5(id) {
            if (State.lvl5.seq.find(b => b.id === id) || State.lvl5.status === 'success') return;
            const block = Scenarios.lvl5[State.scenarios.lvl5].ops.find(b => b.id === id);
            State.lvl5.seq.push(block);
            if (State.lvl5.seq.length === 4) {
                if (State.lvl5.seq[0].id === 'loop' && State.lvl5.seq[1].id === 'passo' && State.lvl5.seq[2].id === 'if' && State.lvl5.seq[3].id === 'apanhar') {
                    State.lvl5.status = 'success';
                } else {
                    State.lvl5.status = 'error';
                }
            }
            render();
        }
        function resetLvl5() { State.lvl5.seq = []; State.lvl5.status = ''; render(); }

        // --- RENDERIZAÇÃO ---
        function render() {
            const header = document.getElementById('game-header');
            const area = document.getElementById('game-area');
            const headerIcon = document.getElementById('header-bot-icon');
            if (headerIcon && !headerIcon.innerHTML) headerIcon.innerHTML = RobotSVGs.head;

            if (State.view === 'intro' || State.view === 'end') {
                header.classList.add('hidden');
            } else {
                header.classList.remove('hidden');
            }

            let html = '';
            switch(State.view) {
                case 'intro': html = renderIntro(); break;
                case 'lvl1': html = renderLvl1(); break;
                case 'lvl2': html = renderLvl2(); break;
                case 'lvl3': html = renderLvl3(); break;
                case 'lvl4': html = renderLvl4(); break;
                case 'lvl5': html = renderLvl5(); break;
                case 'end': html = renderEnd(); break;
            }

            area.innerHTML = html;
            lucide.createIcons();
        }

        // --- COMPONENTES HTML ---
        function renderIntro() {
            return `
                <div class="text-center space-y-8 animate-fade-in">
                    <div class="flex justify-center mb-6">
                        <div class="bg-orange-100 p-6 rounded-[2rem] inline-block shadow-inner border-4 border-orange-200">
                            ${RobotSVGs.wave}
                        </div>
                    </div>
                    <h1 class="text-4xl md:text-5xl font-extrabold text-orange-600 mb-2">Missão: Programar o Robô!</h1>
                    <p class="text-xl text-stone-600 max-w-lg mx-auto">
                        Olá! Eu sou o Professor. Estás preparado para descobrir o que é um Algoritmo e resolver novos puzzles gerados aleatoriamente?
                    </p>
                    <div class="space-y-4 max-w-md mx-auto bg-stone-50 p-6 rounded-2xl border-2 border-stone-200">
                        <div>
                            <label class="block text-sm font-bold text-stone-500 mb-2 uppercase">Dá um nome ao teu Robô:</label>
                            <input type="text" value="${State.robotName}" onkeyup="updateRobotName(this.value)" class="w-full text-center text-2xl font-bold text-orange-600 border-2 border-orange-200 rounded-xl p-3 focus:outline-none focus:border-orange-500" maxlength="12" />
                        </div>
                        <button onclick="setView('lvl1')" class="w-full bg-red-500 hover:bg-red-600 text-white text-xl font-bold py-4 rounded-xl transition-transform hover:scale-105 flex items-center justify-center gap-2 shadow-lg">
                            <i data-lucide="play" class="fill-current"></i> COMEÇAR TREINO
                        </button>
                    </div>
                </div>
            `;
        }

        function renderLevelContainer(title, subtitle, instruction, animHTML, contentHTML, feedbackHTML) {
            return `
                <div class="animate-fade-in flex flex-col h-full">
                    <div class="mb-6">
                        <h2 class="text-sm font-bold text-orange-500 uppercase tracking-widest">${title}</h2>
                        <h3 class="text-2xl md:text-3xl font-extrabold text-stone-800">${subtitle}</h3>
                    </div>
                    <div class="bg-orange-50 text-orange-900 p-4 rounded-xl border border-orange-200 mb-6 flex items-center md:items-start gap-4 shadow-sm">
                        <div class="shrink-0 drop-shadow-md bg-white rounded-full p-2 border-2 border-orange-100">
                            ${RobotSVGs.side}
                        </div>
                        <p class="text-lg font-medium leading-snug pt-2">${instruction}</p>
                    </div>
                    
                    <div class="mb-8 flex items-center justify-center p-6 border-4 border-dashed border-orange-300 rounded-2xl bg-orange-100/50 min-h-[140px] shadow-inner">
                        <div class="relative flex items-center justify-center">
                            ${animHTML}
                        </div>
                    </div>

                    <div class="flex-grow">${contentHTML}${feedbackHTML}</div>
                </div>
            `;
        }

        function renderFeedback(status, successMsg, errorMsg, resetFn, nextView) {
            if (!status) return '';
            const isSuccess = status === 'success';
            const colorClass = isSuccess ? 'bg-green-50 border-green-200 text-green-800' : 'bg-red-50 border-red-200 text-red-800';
            const icon = isSuccess ? '<i data-lucide="check-circle-2" class="w-10 h-10 text-green-500 shrink-0"></i>' : '<i data-lucide="x-circle" class="w-10 h-10 text-red-500 shrink-0"></i>';
            const msg = isSuccess ? successMsg : errorMsg;
            
            let btnHTML = isSuccess 
                ? `<button onclick="setView('${nextView}')" class="bg-green-500 hover:bg-green-600 text-white px-6 py-3 rounded-xl font-bold flex items-center gap-2 shadow-md hover:scale-105 transition-transform w-full md:w-auto justify-center">PRÓXIMO NÍVEL <i data-lucide="arrow-right" class="w-5 h-5"></i></button>` 
                : (resetFn ? `<button onclick="${resetFn}()" class="bg-white text-red-600 border-2 border-red-200 hover:bg-red-100 px-6 py-3 rounded-xl font-bold flex items-center gap-2 shadow-sm transition-colors w-full md:w-auto justify-center"><i data-lucide="undo-2" class="w-5 h-5"></i> TENTAR DE NOVO</button>` : '');

            return `
                <div class="mt-8 p-6 rounded-2xl animate-slide-up flex flex-col md:flex-row items-center justify-between gap-4 border-2 ${colorClass}">
                    <div class="flex items-center gap-4">${icon}<p class="font-bold text-lg">${msg}</p></div>
                    <div class="shrink-0 w-full md:w-auto flex justify-end">${btnHTML}</div>
                </div>
            `;
        }

        function renderLvl1() {
            const data = Scenarios.lvl1[State.scenarios.lvl1];
            
            let optionsHTML = State.lvl1.shuffledOps.map(opt => {
                const isSelected = State.lvl1.seq.includes(opt.id);
                const disabled = isSelected || State.lvl1.status === 'success';
                return `<button onclick="clickLvl1('${opt.id}')" ${disabled ? 'disabled' : ''} class="${opt.color} ${isSelected ? 'opacity-40 grayscale' : 'hover:scale-105 hover:shadow-lg'} transition-all p-4 rounded-xl font-bold text-stone-800 border-b-4 border-black/20 w-full shadow-sm">${opt.label}</button>`;
            }).join('');

            let seqHTML = State.lvl1.seq.map((id, index) => {
                const item = data.ops.find(o => o.id === id);
                return `<div class="${item.color} px-4 py-2 rounded-lg text-sm font-bold flex items-center gap-1 text-stone-800">${index + 1}. ${item.label} ${index < State.lvl1.seq.length - 1 ? '<i data-lucide="arrow-right" class="w-4 h-4"></i>' : ''}</div>`;
            }).join('');

            if(State.lvl1.seq.length === 0) seqHTML = `<span class="text-stone-400 italic">Clica nos botões baralhados acima para organizar os passos...</span>`;

            const content = `
                <div class="grid grid-cols-2 gap-4 mb-8">${optionsHTML}</div>
                <div class="bg-stone-100 min-h-[120px] rounded-2xl p-4 border-2 border-dashed border-stone-300 flex flex-col items-center justify-center relative">
                    <div class="absolute top-[-12px] bg-stone-300 text-xs font-bold px-3 py-1 rounded-full text-stone-600">O Teu Algoritmo Lógico:</div>
                    <div class="flex gap-2 flex-wrap justify-center mt-2">${seqHTML}</div>
                </div>
            `;

            const feedback = renderFeedback(State.lvl1.status, data.success, data.error, "resetLvl1", "lvl2");
            return renderLevelContainer(`Nível 1: ${data.title}`, "O Conceito Elementar", parseText(data.instruction), data.anim, content, feedback);
        }

        function renderLvl2() {
            const data = Scenarios.lvl2[State.scenarios.lvl2];

            let optionsHTML = State.lvl2.shuffledOps.map(opt => {
                const isSelected = State.lvl2.seq.includes(opt.id);
                const disabled = isSelected || State.lvl2.status === 'success';
                return `
                    <button onclick="clickLvl2('${opt.id}')" ${disabled ? 'disabled' : ''} class="bg-amber-100 flex items-center justify-center md:justify-start gap-4 p-4 rounded-xl font-bold text-amber-900 border-b-4 border-amber-200 transition-all ${isSelected ? 'opacity-40 grayscale' : 'hover:scale-[1.02] hover:bg-amber-200'}">
                        <div class="bg-white p-2 rounded-full hidden md:block"><i data-lucide="${opt.icon}" class="w-6 h-6 text-amber-500"></i></div>
                        <span class="text-lg text-center md:text-left">${opt.label}</span>
                    </button>
                `;
            }).join('');

            let seqHTML = State.lvl2.seq.map((id, index) => {
                const item = data.ops.find(o => o.id === id);
                return `<div class="bg-amber-500 text-white px-4 py-2 rounded-lg font-bold flex items-center gap-2"><i data-lucide="${item.icon}" class="w-4 h-4"></i> ${item.label}</div> ${index < 2 ? '<i data-lucide="arrow-right" class="w-5 h-5 text-stone-400"></i>' : ''}`;
            }).join('');

            const content = `
                <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mb-8">${optionsHTML}</div>
                <div class="bg-stone-100 min-h-[100px] rounded-2xl p-4 flex flex-col gap-2">
                    <div class="text-xs font-bold text-stone-500 uppercase tracking-wider mb-2">A tua sequência (da esquerda para a direita):</div>
                    <div class="flex items-center gap-3 overflow-x-auto pb-2">${seqHTML}</div>
                </div>
            `;

            const feedback = renderFeedback(State.lvl2.status, data.success, data.error, "resetLvl2", "lvl3");
            return renderLevelContainer(`Nível 2: ${data.title}`, "A Importância da Sequência", parseText(data.instruction), data.anim, content, feedback);
        }

        function renderLvl3() {
            const data = Scenarios.lvl3[State.scenarios.lvl3];

            let hardCode = [];
            for(let i=1; i<=7; i++) hardCode.push(`${i}. ${data.action}`);

            const content = `
                <div class="grid md:grid-cols-2 gap-6 mb-8">
                    <button onclick="clickLvl3('error')" ${State.lvl3.status === 'success' ? 'disabled' : ''} class="bg-stone-50 border-2 border-stone-200 p-6 rounded-2xl text-left hover:bg-red-50 hover:border-red-200 transition-colors group relative">
                        <div class="text-sm font-bold text-stone-400 group-hover:text-red-400 mb-2">Opção A: Escrever tudo à mão</div>
                        <div class="font-mono text-stone-500 bg-white p-3 rounded border border-stone-200 text-xs leading-relaxed max-h-[150px] overflow-hidden relative">
                            ${hardCode.join('<br>')}...
                            <div class="absolute bottom-0 left-0 right-0 h-10 bg-gradient-to-t from-white to-transparent"></div>
                        </div>
                    </button>
                    <button onclick="clickLvl3('success')" ${State.lvl3.status === 'success' ? 'disabled' : ''} class="bg-stone-50 border-2 border-stone-200 p-6 rounded-2xl text-left hover:bg-green-50 hover:border-green-200 transition-colors group relative">
                        <div class="text-sm font-bold text-stone-400 group-hover:text-green-500 mb-2">Opção B: Usar um Atalho</div>
                        <div class="font-mono text-stone-700 bg-white p-3 rounded border border-stone-200">
                            <div class="text-rose-600 font-bold mb-1">Repete ${data.times} vezes:</div>
                            <div class="pl-4 border-l-2 border-rose-300">[ ${data.action} ]</div>
                        </div>
                    </button>
                </div>
            `;

            const feedback = renderFeedback(State.lvl3.status, "Mágico! Acabaste de usar um Ciclo (Loop). É muito mais rápido!", "Funciona, mas e se fossem 1000 vezes? Dava muito trabalho. Escolhe a opção Inteligente.", "", "lvl4");
            return renderLevelContainer(`Nível 3: ${data.title}`, "A Magia dos Ciclos (Loops)", `O ${State.robotName} tem de repetir uma tarefa. Qual é o código mais inteligente que deves dar ao computador?`, data.anim, content, feedback);
        }

        function renderLvl4() {
            const data = Scenarios.lvl4[State.scenarios.lvl4];

            let buttonsHTML = data.options.map(opt => `
                <button onclick="clickLvl4('${opt.action}')" ${State.lvl4.status === 'success' ? 'disabled' : ''} class="${opt.class} text-white px-4 py-3 rounded-lg text-sm font-bold transition-transform hover:scale-105 shadow-md w-full">
                    ${opt.label}
                </button>
            `).join('');

            const content = `
                <div class="bg-stone-800 rounded-2xl p-6 mb-8 border-2 border-stone-700">
                    <div class="flex items-center gap-4 mb-6 bg-stone-900 p-4 rounded-xl shadow-inner w-max mx-auto border border-stone-700">
                        <div class="w-10 h-10 rounded-full flex items-center justify-center bg-stone-800">
                            <i data-lucide="${data.icon}" class="w-8 h-8 ${data.color} animate-pulse drop-shadow-[0_0_8px_${data.shadow}]"></i>
                        </div>
                        <div class="font-bold text-lg text-stone-300">Atenção Sensor: <br/><span class="${data.color}">${data.alert}</span></div>
                    </div>
                    <div class="font-mono text-lg space-y-4 max-w-lg mx-auto bg-stone-900 text-stone-100 p-6 rounded-xl border border-stone-700">
                        <div class="mb-2"><span class="text-yellow-400 font-bold">SE</span> (${data.cond}) <span class="text-yellow-400 font-bold">ENTÃO:</span></div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-4">${buttonsHTML}</div>
                    </div>
                </div>
            `;

            const feedback = renderFeedback(State.lvl4.status, "Excelente Lógica! Usaste uma Condição (If). O robô verificou o ambiente e escolheu o caminho seguro.", data.errorMsg, "", "lvl5");
            return renderLevelContainer(`Nível 4: ${data.title}`, "Tomar Decisões (If/Else)", parseText(data.instruction), data.anim, content, feedback);
        }

        function renderLvl5() {
            const data = Scenarios.lvl5[State.scenarios.lvl5];

            let optionsHTML = State.lvl5.shuffledOps.map(block => {
                const isSelected = State.lvl5.seq.find(b => b.id === block.id);
                const disabled = isSelected || State.lvl5.status === 'success';
                return `<button onclick="clickLvl5('${block.id}')" ${disabled ? 'disabled' : ''} class="${block.color} text-white px-4 py-2 rounded-lg font-bold shadow-md transform transition-all ${isSelected ? 'opacity-30 scale-95' : 'hover:-translate-y-1 hover:shadow-lg'}">${block.label}</button>`;
            }).join('');

            let seqHTML = State.lvl5.seq.map(block => {
                return `<div class="${block.color} inline-block px-3 py-1 rounded shadow-sm text-white font-bold" style="margin-left: ${block.indent * 24}px; display: block; width: max-content">${block.label}</div>`;
            }).join('');

            if(State.lvl5.seq.length === 0) seqHTML = `<div class="text-stone-500 italic text-center mt-8">Constrói o código aqui...</div>`;

            const content = `
                <div class="flex flex-wrap justify-center gap-2 mb-6">${optionsHTML}</div>
                <div class="bg-stone-900 min-h-[220px] rounded-2xl p-6 font-mono text-white relative shadow-inner border-4 border-stone-700">
                    <div class="text-stone-400 text-sm mb-4 border-b border-stone-700 pb-2 flex items-center justify-between">
                        <span>Bloco do Algoritmo Final:</span>
                        <i data-lucide="${data.icon}" class="w-5 h-5 ${data.iconColor}"></i>
                    </div>
                    <div class="space-y-2">${seqHTML}</div>
                </div>
            `;

            const feedback = renderFeedback(State.lvl5.status, `Parabéns! Juntaste um Ciclo, uma Ação e uma Condição na perfeição. És um mestre da programação!`, "A lógica falhou. Ordem sugerida: 1) Abrir ciclo (Repete), 2) Ação de andar, 3) Condição (Se...), 4) Ação final.", "resetLvl5", "end");
            return renderLevelContainer(`Nível 5: ${data.title}`, "O Desafio Final", parseText(data.instruction), data.anim, content, feedback);
        }

        function renderEnd() {
            return `
                <div class="text-center space-y-8 animate-fade-in py-10">
                    <div class="flex justify-center mb-4">
                        <div class="bg-amber-100 p-8 rounded-full inline-block relative border-4 border-amber-200 shadow-xl">
                            ${RobotSVGs.happy}
                            <div class="absolute -top-2 -right-2 bg-white rounded-full p-3 shadow-md border-2 border-stone-200 animate-bounce">
                                <i data-lucide="award" class="w-10 h-10 text-amber-500"></i>
                            </div>
                        </div>
                    </div>
                    <h1 class="text-4xl md:text-5xl font-extrabold text-amber-500 mb-2">Parabéns, Programador(a)!</h1>
                    <p class="text-xl text-stone-600 max-w-lg mx-auto">
                        O <b>${State.robotName}</b> está super orgulhoso! Descobriste que programar é dar regras precisas, usar sequências e condições lógicas.
                    </p>
                    <button onclick="initGame()" class="mt-8 bg-red-500 hover:bg-red-600 text-white text-xl font-bold py-4 px-8 rounded-xl transition-transform hover:scale-105 shadow-lg inline-flex items-center gap-2">
                        <i data-lucide="refresh-ccw" class="w-6 h-6"></i> RECOMEÇAR COM NOVOS DESAFIOS
                    </button>
                </div>
            `;
        }

        // --- INICIALIZAÇÃO ---
        document.addEventListener('DOMContentLoaded', () => {
            initGame();
        });

    </script>
</body>
</html>
