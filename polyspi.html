<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polyspiral Generative Art with Gestures</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0f172a; /* Slate 900 */
            font-family: 'Inter', sans-serif;
        }
        canvas {
            display: block;
        }
        /* Custom scrollbar for controls */
        .custom-scroll::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: #1e293b; 
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: #475569; 
            border-radius: 3px;
        }
        .slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            height: 4px;
            background: #334155;
            border-radius: 2px;
            outline: none;
        }
        .slider-thumb::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            background: #38bdf8; /* Sky 400 */
            cursor: pointer;
            border-radius: 50%;
            transition: transform 0.1s;
        }
        .slider-thumb::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }
        
        #webcamContainer {
            transition: all 0.3s ease;
        }
        #webcamContainer.active {
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
            border-color: #38bdf8;
        }
    </style>
</head>
<body class="text-slate-200">

    <!-- Main Container -->
    <div class="relative w-full h-screen flex flex-col md:flex-row">
        
        <!-- Controls Sidebar -->
        <div class="absolute z-20 bottom-0 left-0 right-0 md:static md:w-80 md:h-full bg-slate-900/95 backdrop-blur-md border-t md:border-t-0 md:border-r border-slate-700 p-6 flex flex-col gap-6 shadow-2xl custom-scroll overflow-y-auto transition-all duration-300" id="controlsPanel">
            
            <div class="flex justify-between items-center mb-2">
                <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-sky-400 to-indigo-400">
                    <i class="fa-solid fa-hand-sparkles mr-2"></i>Polyspirals
                </h1>
                <button id="toggleControls" class="md:hidden text-slate-400 hover:text-white">
                    <i class="fa-solid fa-chevron-down"></i>
                </button>
            </div>

            <!-- Webcam Section -->
            <div class="bg-slate-800/50 rounded-lg p-3 border border-slate-700">
                <div class="flex justify-between items-center mb-2">
                    <label class="text-xs font-bold text-sky-400 uppercase tracking-wider">Gesture Control</label>
                    <span id="modelStatus" class="text-[10px] text-slate-500">Model Loading...</span>
                </div>
                
                <div id="webcamContainer" class="relative w-full aspect-video bg-black rounded overflow-hidden border border-slate-600 mb-3 hidden">
                    <video id="webcam" class="absolute inset-0 w-full h-full object-cover transform -scale-x-100" autoplay playsinline></video>
                    <div id="gestureLabel" class="absolute bottom-1 left-2 text-xs font-bold text-white bg-black/50 px-2 rounded">None</div>
                </div>

                <button id="webcamBtn" class="w-full py-2 px-3 bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs font-medium rounded transition flex items-center justify-center gap-2" disabled>
                    <i class="fa-solid fa-video"></i> <span>Enable Webcam</span>
                </button>
                
                <div class="mt-2 text-[10px] text-slate-400 grid grid-cols-2 gap-2">
                    <div class="flex items-center gap-1"><i class="fa-regular fa-hand-paper text-sky-400"></i> Angle + / Stop Color</div>
                    <div class="flex items-center gap-1"><i class="fa-regular fa-hand-rock text-sky-400"></i> Angle - / Start Color</div>
                </div>
            </div>

            <p class="text-xs text-slate-400">
                Adjust the geometry parameters to generate unique mathematical patterns.
            </p>

            <!-- Angle Control -->
            <div class="control-group">
                <div class="flex justify-between mb-2">
                    <label class="text-sm font-medium text-slate-300">Angle</label>
                    <span id="angleValue" class="text-sm font-mono text-sky-400">90.00°</span>
                </div>
                <input type="range" id="angleInput" min="90" max="180" step="0.1" value="91.5" class="slider-thumb w-full mb-1">
                <div class="flex justify-between text-xs text-slate-500">
                    <span>90°</span>
                    <span>180°</span>
                </div>
            </div>

            <!-- Step Control -->
            <div class="control-group">
                <div class="flex justify-between mb-2">
                    <label class="text-sm font-medium text-slate-300">Step (Increment)</label>
                    <span id="stepValue" class="text-sm font-mono text-sky-400">5</span>
                </div>
                <input type="range" id="stepInput" min="1" max="20" step="0.5" value="5" class="slider-thumb w-full mb-1">
            </div>

            <!-- Iterations Control -->
            <div class="control-group">
                <div class="flex justify-between mb-2">
                    <label class="text-sm font-medium text-slate-300">Length / Iterations</label>
                    <span id="iterValue" class="text-sm font-mono text-sky-400">600</span>
                </div>
                <input type="range" id="iterInput" min="100" max="3000" step="10" value="800" class="slider-thumb w-full mb-1">
            </div>

            <!-- Settings Divider -->
            <hr class="border-slate-700 my-2">

            <!-- Toggles -->
            <div class="flex items-center justify-between">
                <label class="text-sm text-slate-300">Rainbow Color</label>
                <div class="relative inline-block w-10 mr-2 align-middle select-none transition duration-200 ease-in">
                    <input type="checkbox" name="toggle" id="colorToggle" checked class="toggle-checkbox absolute block w-5 h-5 rounded-full bg-white border-4 appearance-none cursor-pointer translate-x-5 border-sky-500 right-0 checked:right-0"/>
                    <label for="colorToggle" class="toggle-label block overflow-hidden h-5 rounded-full bg-sky-900 cursor-pointer"></label>
                </div>
            </div>

            <!-- Actions -->
            <div class="mt-auto pt-6 flex gap-3">
                <button id="resetBtn" class="flex-1 py-2 px-4 bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm font-medium rounded-lg transition border border-slate-600">
                    Reset
                </button>
                <button id="downloadBtn" class="flex-1 py-2 px-4 bg-sky-600 hover:bg-sky-500 text-white text-sm font-medium rounded-lg transition shadow-lg shadow-sky-900/50">
                    <i class="fa-solid fa-download mr-2"></i>Save
                </button>
            </div>
        </div>

        <!-- Canvas Area -->
        <div class="flex-1 relative bg-black flex items-center justify-center overflow-hidden cursor-crosshair" id="canvasContainer">
            <canvas id="artCanvas"></canvas>
            
            <!-- Overlay Info -->
            <div class="absolute top-4 right-4 pointer-events-none text-right opacity-50 hidden md:block">
                <div class="text-xs text-slate-500 uppercase tracking-widest">Renderer</div>
                <div class="text-sm font-mono text-slate-400">HTML5 Canvas API</div>
            </div>
            
             <div id="gestureIndicator" class="absolute top-4 left-4 pointer-events-none opacity-0 transition-opacity duration-300">
                <div class="flex items-center gap-3 bg-slate-900/80 backdrop-blur px-4 py-2 rounded-full border border-sky-500/50">
                     <i id="gestureIcon" class="fa-solid fa-hand text-sky-400 text-xl"></i>
                     <span id="gestureText" class="text-sm font-bold text-white">Gesture Active</span>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import {
            GestureRecognizer,
            FilesetResolver,
            DrawingUtils
        } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3";

        // DOM Elements
        const canvas = document.getElementById('artCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('canvasContainer');
        
        // Inputs
        const angleInput = document.getElementById('angleInput');
        const angleValDisplay = document.getElementById('angleValue');
        const stepInput = document.getElementById('stepInput');
        const stepValDisplay = document.getElementById('stepValue');
        const iterInput = document.getElementById('iterInput');
        const iterValDisplay = document.getElementById('iterValue');
        const colorToggle = document.getElementById('colorToggle');
        const resetBtn = document.getElementById('resetBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        
        // Webcam Elements
        const webcamBtn = document.getElementById('webcamBtn');
        const video = document.getElementById('webcam');
        const webcamContainer = document.getElementById('webcamContainer');
        const modelStatus = document.getElementById('modelStatus');
        const gestureLabel = document.getElementById('gestureLabel');
        const gestureIndicator = document.getElementById('gestureIndicator');
        const gestureIcon = document.getElementById('gestureIcon');
        const gestureText = document.getElementById('gestureText');

        // State
        let state = {
            angle: 91.5,
            step: 5, // Updated default to 5
            iterations: 800,
            isRainbow: true,
            hueOffset: 0,
            colorCycling: false, // Controls color animation
            webcamRunning: false
        };

        // MediaPipe Variables
        let gestureRecognizer;
        let runningMode = "VIDEO";
        let lastVideoTime = -1;

        // Initialize Gesture Recognizer
        const createGestureRecognizer = async () => {
            try {
                const vision = await FilesetResolver.forVisionTasks(
                    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm"
                );
                gestureRecognizer = await GestureRecognizer.createFromOptions(vision, {
                    baseOptions: {
                        modelAssetPath:
                            "https://storage.googleapis.com/mediapipe-models/gesture_recognizer/gesture_recognizer/float16/1/gesture_recognizer.task",
                        delegate: "GPU"
                    },
                    runningMode: runningMode
                });
                webcamBtn.disabled = false;
                modelStatus.textContent = "Model Ready";
                modelStatus.classList.remove("text-slate-500");
                modelStatus.classList.add("text-green-400");
            } catch (error) {
                console.error(error);
                modelStatus.textContent = "Load Error";
                modelStatus.classList.add("text-red-500");
            }
        };
        createGestureRecognizer();

        // Resize Canvas
        function resize() {
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
        }
        window.addEventListener('resize', resize);

        // Core Drawing Logic
        function draw() {
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const cx = canvas.width / 2;
            const cy = canvas.height / 2;

            ctx.save();
            ctx.translate(cx, cy);

            let currentLen = 0;
            let currentAngle = 0;
            const radAngle = (state.angle * Math.PI) / 180;

            ctx.lineWidth = 1.5;
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';
            
            let x = 0;
            let y = 0;

            if (state.isRainbow) {
                for (let i = 0; i < state.iterations; i++) {
                    ctx.beginPath();
                    ctx.moveTo(x, y);

                    x += Math.cos(currentAngle) * currentLen;
                    y += Math.sin(currentAngle) * currentLen;

                    ctx.lineTo(x, y);

                    const hue = (i * 0.5 + state.hueOffset) % 360;
                    ctx.strokeStyle = `hsl(${hue}, 80%, 60%)`;
                    ctx.stroke();

                    currentLen += state.step;
                    currentAngle += radAngle;
                }
            } else {
                ctx.strokeStyle = '#38bdf8';
                ctx.shadowBlur = 4;
                ctx.shadowColor = '#0ea5e9';
                
                ctx.beginPath();
                ctx.moveTo(0, 0);

                for (let i = 0; i < state.iterations; i++) {
                    x += Math.cos(currentAngle) * currentLen;
                    y += Math.sin(currentAngle) * currentLen;
                    ctx.lineTo(x, y);
                    
                    currentLen += state.step;
                    currentAngle += radAngle;
                }
                ctx.stroke();
                ctx.shadowBlur = 0;
            }

            ctx.restore();
        }

        // Render Loop (Handles Drawing + Logic + MediaPipe)
        async function renderLoop() {
            // 1. Handle Color Animation
            if (state.colorCycling) {
                state.hueOffset += 2;
            }

            // 2. Handle Webcam & Gestures
            if (state.webcamRunning && gestureRecognizer && video.readyState >= 2) {
                if (video.currentTime !== lastVideoTime) {
                    lastVideoTime = video.currentTime;
                    try {
                        const results = gestureRecognizer.recognizeForVideo(video, Date.now());

                        if (results.gestures.length > 0) {
                            const gesture = results.gestures[0][0];
                            const name = gesture.categoryName;
                            const score = gesture.score;

                            gestureLabel.textContent = `${name} (${Math.round(score * 100)}%)`;

                            // Logic: Hand Opening (Open_Palm) vs Closing (Closed_Fist)
                            if (name === "Open_Palm") {
                                // Open Palm: Increase Angle, Stop Color
                                let newAngle = state.angle + 0.2;
                                if (newAngle > 180) newAngle = 180;
                                state.angle = newAngle;
                                state.colorCycling = false;
                                
                                showGestureFeedback("fa-hand-paper", "Increasing Angle");
                            } else if (name === "Closed_Fist") {
                                // Fist: Decrease Angle, Start Color
                                let newAngle = state.angle - 0.2;
                                if (newAngle < 90) newAngle = 90;
                                state.angle = newAngle;
                                state.colorCycling = true;
                                
                                showGestureFeedback("fa-hand-rock", "Decreasing Angle + Color");
                            } else {
                                hideGestureFeedback();
                            }

                            // Sync inputs
                            angleInput.value = state.angle;
                            angleValDisplay.textContent = state.angle.toFixed(2) + '°';
                        } else {
                            gestureLabel.textContent = "Scanning...";
                            hideGestureFeedback();
                        }
                    } catch (e) {
                        console.error("Recognition error:", e);
                    }
                }
            }

            // 3. Draw
            draw();
            requestAnimationFrame(renderLoop);
        }

        // Helper for on-screen feedback
        let feedbackTimeout;
        function showGestureFeedback(iconClass, text) {
            gestureIndicator.style.opacity = '1';
            gestureIcon.className = `fa-regular ${iconClass} text-sky-400 text-xl`;
            gestureText.textContent = text;
            clearTimeout(feedbackTimeout);
            feedbackTimeout = setTimeout(() => {
                // Keep active while gesture is held
            }, 100);
        }

        function hideGestureFeedback() {
             gestureIndicator.style.opacity = '0';
        }

        // Webcam Activation
        webcamBtn.addEventListener('click', async () => {
            if (!gestureRecognizer) {
                alert("Please wait for model to load");
                return;
            }

            if (state.webcamRunning) {
                state.webcamRunning = false;
                webcamBtn.innerHTML = '<i class="fa-solid fa-video"></i> <span>Enable Webcam</span>';
                webcamBtn.classList.remove('bg-red-600', 'hover:bg-red-500');
                webcamBtn.classList.add('bg-slate-700', 'hover:bg-slate-600');
                webcamContainer.classList.add('hidden');
                
                const stream = video.srcObject;
                if (stream) {
                    const tracks = stream.getTracks();
                    tracks.forEach(track => track.stop());
                }
                video.srcObject = null;
            } else {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                    video.srcObject = stream;
                    video.play(); // Explicitly play video to ensure data flow
                    
                    // Wait for data before starting loop logic
                    video.onloadeddata = () => {
                        state.webcamRunning = true;
                        webcamBtn.innerHTML = '<i class="fa-solid fa-video-slash"></i> <span>Disable Webcam</span>';
                        webcamBtn.classList.remove('bg-slate-700', 'hover:bg-slate-600');
                        webcamBtn.classList.add('bg-red-600', 'hover:bg-red-500');
                        webcamContainer.classList.remove('hidden');
                    };
                } catch (err) {
                    console.error(err);
                    alert("Could not access webcam. Please allow permissions.");
                }
            }
        });

        // Manual Inputs
        function updateStateFromInputs() {
            state.angle = parseFloat(angleInput.value);
            state.step = parseFloat(stepInput.value);
            state.iterations = parseInt(iterInput.value);
            state.isRainbow = colorToggle.checked;

            angleValDisplay.textContent = state.angle.toFixed(2) + '°';
            stepValDisplay.textContent = state.step;
            iterValDisplay.textContent = state.iterations;
        }

        [angleInput, stepInput, iterInput].forEach(input => {
            input.addEventListener('input', updateStateFromInputs);
        });

        colorToggle.addEventListener('change', updateStateFromInputs);

        resetBtn.addEventListener('click', () => {
            state.angle = 91.5;
            state.step = 5;
            state.iterations = 800;
            state.hueOffset = 0;
            state.colorCycling = false;
            
            // Sync inputs
            angleInput.value = 91.5;
            stepInput.value = 5;
            iterInput.value = 800;
            colorToggle.checked = true;
            
            updateStateFromInputs();
        });

        downloadBtn.addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = `polyspiral-${state.angle.toFixed(2)}deg.png`;
            link.href = canvas.toDataURL();
            link.click();
        });

        // Init
        resize();
        updateStateFromInputs();
        renderLoop();

    </script>
</body>
</html>
