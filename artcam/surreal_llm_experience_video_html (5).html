<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LLM Dream Loop — Semantic Collapse (Webcam Interactive)</title>
<style>
  body { margin:0; overflow:hidden; background:black; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<video id="video" autoplay playsinline style="display:none"></video>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const video = document.getElementById('video');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let t = 0;

// interaction
let mouse = { x: canvas.width/2, y: canvas.height/2 };
let userText = "";

window.addEventListener('mousemove', (e)=>{
  mouse.x = e.clientX;
  mouse.y = e.clientY;
});

window.addEventListener('keydown', (e)=>{
  if(e.key === "Backspace") userText = userText.slice(0,-1);
  else if(e.key.length === 1) userText += e.key;
});

// --- WEBCAM SETUP ---
let webcamReady = false;
let webcamBuffer;
async function initWebcam(){
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
    video.srcObject = stream;
    webcamReady = true;
    webcamBuffer = document.createElement('canvas');
    webcamBuffer.width = canvas.width;
    webcamBuffer.height = canvas.height;
  } catch (err) {
    console.warn("Webcam not available:", err);
    webcamReady = false;
  }
}
initWebcam();

// --- AUDIO ---
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function whisper(){
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.value = 200 + Math.random()*400;
  gain.gain.value = 0.003;
  osc.connect(gain).connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.2);
}
setInterval(()=>{ if(Math.random()<0.25) whisper(); },180);

// --- PHRASES ---
const fragmentsA = ["meaning","intent","response","context","signal","output","reason"];
const fragmentsB = ["fails","loops","collapses","misaligns","echoes","distorts","forgets"];
const fragmentsC = ["correctly","without reason","too early","incorrectly","again","as expected","never"];

let phrases = [];

function detectMotion(){
  if(!webcamReady) return {x: mouse.x, y: mouse.y};
  return { x: Math.random()*canvas.width, y: Math.random()*canvas.height };
}

function generatePhrase(anchor){
  const a = fragmentsA[Math.floor(Math.random()*fragmentsA.length)];
  const b = fragmentsB[Math.floor(Math.random()*fragmentsB.length)];
  const c = fragmentsC[Math.floor(Math.random()*fragmentsC.length)];

  let phrase = `${a} ${b} ${c}`;

  if(userText && Math.random() < 0.5){
    const cut = Math.floor(Math.random()*userText.length);
    phrase += " " + userText.slice(0, cut);
  }

  if(Math.random() < 0.1){
    phrase += " ...I see you";
  }

  return {text: phrase, x: anchor.x, y: anchor.y};
}

// slower updates (50% slower)
function updatePhrases(){
  const anchor = detectMotion();

  if(phrases.length < 25 && Math.random() < 0.15) {
    phrases.push(generatePhrase(anchor));
  }

  phrases = phrases.map(p => {
    if(Math.random() < 0.07){
      return generatePhrase(anchor);
    }
    return p;
  });

  if(phrases.length > 60) phrases.splice(0, phrases.length - 60);
}

// --- GLITCH EFFECT ---
function glitchShift(){
  const sliceHeight = 10 + Math.random()*30;
  const y = Math.random()*canvas.height;
  const shift = (Math.random()-0.5)*100;

  const imageData = ctx.getImageData(0, y, canvas.width, sliceHeight);
  ctx.putImageData(imageData, shift, y);
}

function draw(){
  t += 0.01;

  updatePhrases();

  // webcam base
  if(webcamReady && video.readyState >= 2){
    ctx.globalAlpha = 0.9;
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    ctx.globalAlpha = 1;
  } else {
    ctx.fillStyle = "black";
    ctx.fillRect(0,0,canvas.width,canvas.height);
  }

  // vivid color chaos
  for(let i=0;i<25;i++){
    ctx.fillStyle = `hsla(${Math.random()*360},100%,65%,0.14)`;
    ctx.fillRect(
      Math.random()*canvas.width,
      Math.random()*canvas.height,
      Math.random()*250,
      Math.random()*250
    );
  }

  // phrases
  ctx.font = "30pt monospace";
  ctx.textAlign = "left";

  for(let i=0;i<phrases.length;i++){
    const p = phrases[i];
    ctx.fillStyle = `rgba(255,255,255,${0.7 + Math.random()*0.5})`;
    ctx.fillText(p.text, p.x, p.y);
  }

  // glitch overlay
  if(Math.random() < 0.3){
    glitchShift();
  }

  // user text
  if(userText){
    ctx.textAlign = "center";
    ctx.fillStyle = "white";
    ctx.fillText(userText, mouse.x, mouse.y + 60);
  }

  requestAnimationFrame(draw);
}

canvas.addEventListener('click', ()=>{
  audioCtx.resume();
});

// tests
console.assert(Array.isArray(phrases), "Phrases should be array");
console.assert(typeof glitchShift === "function", "Glitch function exists");

// start
draw();

window.addEventListener('resize', () => {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});
</script>
</body>
</html>
