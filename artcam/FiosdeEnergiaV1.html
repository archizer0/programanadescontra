<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fios de Energia entre as Mãos</title>
    
    <!-- Tailwind CSS para o estilo da Interface de Utilizador -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Bibliotecas do MediaPipe para deteção das mãos e câmara -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #020205; /* Fundo ligeiramente mais profundo */
            overflow: hidden;
            font-family: sans-serif;
        }

        #output_canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            transform: scaleX(-1);
            z-index: 10;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 20;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .loader {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-left-color: #00eeff;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <video id="input_video" style="display: none;" playsinline></video>
    <canvas id="output_canvas"></canvas>

    <div id="ui-layer">
        <div id="loading-box" class="bg-black/70 backdrop-blur-md p-8 rounded-2xl flex flex-col items-center text-center shadow-2xl border border-white/10 transition-opacity duration-500">
            <div class="loader mb-6"></div>
            <h1 class="text-2xl font-bold text-white mb-2">A sintonizar brilho...</h1>
            <p class="text-gray-300 max-w-xs">Mostra as tuas mãos para ver a luminescência geométrica.</p>
        </div>
    </div>

    <script>
        const videoElement = document.getElementById('input_video');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const loadingBox = document.getElementById('loading-box');

        let isModelLoaded = false;

        // Funções de desenho
        function drawHexStar(ctx, x, y, radius) {
            ctx.beginPath();
            for (let i = 0; i < 12; i++) {
                const angle = (i * Math.PI) / 6;
                const r = (i % 2 === 0) ? radius : radius * 0.5;
                const px = x + Math.cos(angle) * r;
                const py = y + Math.sin(angle) * r;
                if (i === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.closePath();
            ctx.stroke();
        }

        function drawCircle(ctx, x, y, radius) {
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI * 2);
            ctx.stroke();
        }

        function drawSquare(ctx, x, y, radius) {
            const size = radius * 1.5;
            ctx.strokeRect(x - size / 2, y - size / 2, size, size);
        }

        const getLandmarkColor = (index, alpha = 1) => {
            const colors = {
                polegar: `rgba(255, 0, 85, ${alpha})`,
                indicador: `rgba(0, 238, 255, ${alpha})`,
                medio: `rgba(0, 255, 102, ${alpha})`,
                anelar: `rgba(255, 221, 0, ${alpha})`,
                minimo: `rgba(170, 0, 255, ${alpha})`,
                default: `rgba(255, 255, 255, ${alpha})`
            };

            if (index >= 1 && index <= 4) return colors.polegar; 
            if (index >= 5 && index <= 8) return colors.indicador; 
            if (index >= 9 && index <= 12) return colors.medio; 
            if (index >= 13 && index <= 16) return colors.anelar; 
            if (index >= 17 && index <= 20) return colors.minimo; 
            return colors.default;
        };

        function applyGlowEffect(ctx, color, blur = 15) {
            ctx.strokeStyle = color;
            ctx.shadowBlur = blur;
            ctx.shadowColor = color;
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';
        }

        function onResults(results) {
            if (!isModelLoaded) {
                isModelLoaded = true;
                loadingBox.style.opacity = '0';
                setTimeout(() => loadingBox.style.display = 'none', 500);
            }

            if (canvasElement.width !== results.image.width) {
                canvasElement.width = results.image.width;
                canvasElement.height = results.image.height;
            }

            canvasCtx.save();
            // Limpeza com fundo preto profundo
            canvasCtx.fillStyle = '#020205';
            canvasCtx.fillRect(0, 0, canvasElement.width, canvasElement.height);

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const time = performance.now() * 0.001;

                // 1. Desenhar Formas Geométricas em cada mão
                for (const landmarks of results.multiHandLandmarks) {
                    landmarks.forEach((point, index) => {
                        const x = point.x * canvasElement.width;
                        const y = point.y * canvasElement.height;
                        const baseColor = getLandmarkColor(index, 0.8);
                        const glowColor = getLandmarkColor(index, 0.4);

                        const scale = 2 + (index % 9); 
                        const r1 = 14 * scale; 
                        const r2 = 8 * scale;  
                        const r3 = 4 * scale;  
                        const combo = index % 3;

                        canvasCtx.save();
                        canvasCtx.translate(x, y);

                        // Desenhar cada camada com brilho suave
                        const drawShapeSet = (radius, type, rotation) => {
                            canvasCtx.save();
                            canvasCtx.rotate(rotation);
                            
                            // Camada de Brilho Exterior (Difuso)
                            applyGlowEffect(canvasCtx, glowColor, 25);
                            canvasCtx.lineWidth = 4;
                            if (type === 'circle') drawCircle(canvasCtx, 0, 0, radius);
                            else if (type === 'star') drawHexStar(canvasCtx, 0, 0, radius);
                            else drawSquare(canvasCtx, 0, 0, radius);

                            // Camada Central (Nitidez)
                            applyGlowEffect(canvasCtx, baseColor, 8);
                            canvasCtx.lineWidth = 1.5;
                            if (type === 'circle') drawCircle(canvasCtx, 0, 0, radius);
                            else if (type === 'star') drawHexStar(canvasCtx, 0, 0, radius);
                            else drawSquare(canvasCtx, 0, 0, radius);

                            canvasCtx.restore();
                        };

                        // Aplicar as rotações e tipos conforme o combo
                        if (combo === 0) {
                            drawShapeSet(r1, 'circle', 0);
                            drawShapeSet(r2, 'square', -time * 1.2);
                            drawShapeSet(r3, 'star', time);
                        } else if (combo === 1) {
                            drawShapeSet(r1, 'star', time);
                            drawShapeSet(r2, 'circle', 0);
                            drawShapeSet(r3, 'square', -time * 1.5);
                        } else {
                            drawShapeSet(r1, 'square', -time);
                            drawShapeSet(r2, 'star', time * 1.3);
                            drawShapeSet(r3, 'circle', 0);
                        }

                        canvasCtx.restore();
                    });
                }

                // 2. Desenhar Fios de Energia (Brilho Suave)
                if (results.multiHandLandmarks.length >= 2) {
                    const hand1 = results.multiHandLandmarks[0];
                    const hand2 = results.multiHandLandmarks[1];

                    for (let i = 0; i < 21; i++) {
                        const point1 = hand1[i];
                        const point2 = hand2[i];
                        const baseColor = getLandmarkColor(i, 0.9);
                        const glowColor = getLandmarkColor(i, 0.3);

                        const x1 = point1.x * canvasElement.width;
                        const y1 = point1.y * canvasElement.height;
                        const x2 = point2.x * canvasElement.width;
                        const y2 = point2.y * canvasElement.height;

                        const dx = x2 - x1;
                        const dy = y2 - y1;
                        const distance = Math.sqrt(dx * dx + dy * dy);
                        const sag = distance * 0.25; 

                        const cx = (x1 + x2) / 2;
                        const cy = (y1 + y2) / 2 + sag;

                        // Passo 1: Brilho exterior do fio
                        canvasCtx.beginPath();
                        canvasCtx.moveTo(x1, y1);
                        canvasCtx.quadraticCurveTo(cx, cy, x2, y2);
                        applyGlowEffect(canvasCtx, glowColor, 20);
                        canvasCtx.lineWidth = 3;
                        canvasCtx.stroke();

                        // Passo 2: Núcleo do fio
                        canvasCtx.beginPath();
                        canvasCtx.moveTo(x1, y1);
                        canvasCtx.quadraticCurveTo(cx, cy, x2, y2);
                        applyGlowEffect(canvasCtx, baseColor, 10);
                        canvasCtx.lineWidth = 1;
                        canvasCtx.stroke();
                        
                        // Passo 3: Faísca central branca
                        canvasCtx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
                        canvasCtx.shadowBlur = 4;
                        canvasCtx.lineWidth = 0.5;
                        canvasCtx.stroke();
                    }
                }
            }
            canvasCtx.restore();
        }

        const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
        hands.setOptions({
            maxNumHands: 2,
            modelComplexity: 1,
            minDetectionConfidence: 0.6,
            minTrackingConfidence: 0.6
        });
        hands.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => { await hands.send({image: videoElement}); },
            width: 1280,
            height: 720,
            facingMode: 'user'
        });

        camera.start();
    </script>
</body>
</html>
