<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WIREFRAME — Aesthetic Engine</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@300;400;600&display=swap');

  :root {
    --black: #000000;
    --orange: #c8732a;
    --orange-bright: #e8923e;
    --white: #f0f0f0;
    --dim: #444;
    --panel: #0a0a0a;
    --border: #1a1a1a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--black);
    color: var(--white);
    font-family: 'Rajdhani', sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 28px;
    border-bottom: 1px solid var(--border);
    position: relative;
  }
  header::after {
    content: '';
    position: absolute;
    bottom: -1px; left: 0;
    width: 100px; height: 1px;
    background: var(--orange);
  }
  .logo { font-family: 'Share Tech Mono', monospace; font-size: 14px; letter-spacing: 6px; }
  .logo span { color: var(--orange); }
  .header-right { display: flex; align-items: center; gap: 20px; }
  .fps-badge {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px; letter-spacing: 2px; color: var(--dim);
    display: flex; align-items: center; gap: 6px;
  }
  .fps-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--dim); transition: background 0.3s;
  }
  .fps-dot.live { background: var(--orange); box-shadow: 0 0 6px var(--orange); }
  .header-tag { font-family: 'Share Tech Mono', monospace; font-size: 10px; letter-spacing: 3px; color: var(--dim); }

  main { flex: 1; display: grid; grid-template-columns: 280px 1fr; overflow: hidden; }

  aside {
    border-right: 1px solid var(--border);
    padding: 20px 18px;
    display: flex; flex-direction: column; gap: 20px;
    overflow-y: auto; overflow-x: hidden;
    background: #050505;
  }
  aside::-webkit-scrollbar { width: 2px; }
  aside::-webkit-scrollbar-thumb { background: var(--border); }

  .section-label {
    font-family: 'Share Tech Mono', monospace;
    font-size: 9px; letter-spacing: 4px; color: var(--orange);
    margin-bottom: 10px; text-transform: uppercase;
  }

  .mode-switch { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--border); overflow: hidden; }
  .mode-btn {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px; letter-spacing: 2px; padding: 10px;
    background: transparent; color: var(--dim);
    border: none; cursor: pointer; transition: all 0.2s; text-align: center;
  }
  .mode-btn.active { background: var(--orange); color: var(--black); }
  .mode-btn:not(.active):hover { color: var(--orange); }

  .source-panel { display: none; flex-direction: column; gap: 10px; }
  .source-panel.visible { display: flex; }

  .webcam-preview {
    aspect-ratio: 4/3; background: var(--panel);
    border: 1px solid var(--border); position: relative;
    overflow: hidden; display: flex; align-items: center; justify-content: center;
  }
  #videoEl {
    width: 100%; height: 100%; object-fit: cover;
    display: none; transform: scaleX(-1); opacity: 0.35;
  }
  .webcam-overlay { position: absolute; inset: 0; pointer-events: none; }
  .webcam-status {
    position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
    font-family: 'Share Tech Mono', monospace; font-size: 9px; letter-spacing: 2px;
    color: var(--dim); white-space: nowrap;
  }
  .scan-line {
    position: absolute; left: 0; right: 0; height: 1px;
    background: rgba(200,115,42,0.4);
    animation: scan 3s linear infinite; display: none;
  }
  .scan-line.active { display: block; }
  @keyframes scan { 0% { top: 0%; } 100% { top: 100%; } }

  .drop-zone {
    border: 1px dashed var(--dim); aspect-ratio: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px; cursor: pointer; transition: border-color 0.2s, background 0.2s;
    position: relative; overflow: hidden; background: var(--panel);
  }
  .drop-zone:hover { border-color: var(--orange); }
  .drop-zone.drag-over { border-color: var(--orange-bright); background: #0d0800; }
  .drop-zone-icon { width: 32px; height: 32px; stroke: var(--dim); transition: stroke 0.2s; fill: none; }
  .drop-zone:hover .drop-zone-icon { stroke: var(--orange); }
  .drop-zone-text {
    font-family: 'Share Tech Mono', monospace; font-size: 9px; letter-spacing: 2px;
    color: var(--dim); text-align: center; line-height: 1.7;
  }
  .drop-zone-thumb { position: absolute; inset: 0; object-fit: cover; opacity: 0.45; display: none; }
  #fileInput { display: none; }

  .control-group { display: flex; flex-direction: column; gap: 12px; }
  .control-row { display: flex; flex-direction: column; gap: 5px; }
  .control-header { display: flex; justify-content: space-between; align-items: baseline; }
  .control-name { font-size: 10px; letter-spacing: 2px; color: #777; text-transform: uppercase; }
  .control-val { font-family: 'Share Tech Mono', monospace; font-size: 11px; color: var(--orange); }

  input[type=range] {
    -webkit-appearance: none; width: 100%; height: 1px;
    background: var(--border); outline: none; cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 10px; height: 10px;
    background: var(--orange); border-radius: 50%; transition: transform 0.15s;
  }

  .toggle-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 5px 0; border-top: 1px solid var(--border);
  }
  .toggle-label { font-size: 10px; letter-spacing: 2px; color: #777; text-transform: uppercase; }
  .toggle {
    width: 28px; height: 14px; background: var(--border); border-radius: 7px;
    position: relative; cursor: pointer; transition: background 0.2s;
    border: none; outline: none; flex-shrink: 0;
  }
  .toggle.on { background: var(--orange); }
  .toggle::after {
    content: ''; position: absolute; top: 2px; left: 2px;
    width: 10px; height: 10px; background: var(--black);
    border-radius: 50%; transition: transform 0.2s;
  }
  .toggle.on::after { transform: translateX(14px); }

  .btn {
    font-family: 'Share Tech Mono', monospace; font-size: 10px; letter-spacing: 3px;
    text-transform: uppercase; border: none; cursor: pointer; padding: 10px;
    transition: all 0.2s; width: 100%;
    display: flex; align-items: center; justify-content: center; gap: 7px;
  }
  .btn-primary { background: var(--orange); color: var(--black); }
  .btn-primary:hover { background: var(--orange-bright); }
  .btn-primary:disabled { background: #1a1a1a; color: #333; cursor: not-allowed; }
  .btn-danger { background: #200500; color: #c44; border: 1px solid #3a0800; }
  .btn-ghost { background: transparent; color: var(--dim); border: 1px solid var(--border); }
  .btn-ghost:hover:not(:disabled) { border-color: var(--orange); color: var(--orange); }

  .canvas-area {
    display: flex; align-items: center; justify-content: center;
    background: var(--black); position: relative; overflow: hidden;
  }
  .canvas-area::before {
    content: ''; position: absolute; inset: 0;
    background:
      linear-gradient(rgba(200,115,42,0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(200,115,42,0.02) 1px, transparent 1px);
    background-size: 40px 40px; pointer-events: none;
  }
  #outputCanvas { max-width: 95%; max-height: 95%; display: block; position: relative; z-index: 1; border: 1px solid #111; }
  
  .placeholder-ui {
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    color: var(--dim); z-index: 1; pointer-events: none;
  }
  .placeholder-ui p { font-family: 'Share Tech Mono', monospace; font-size: 10px; letter-spacing: 3px; }

  .corner { position: absolute; width: 10px; height: 10px; pointer-events: none; z-index: 2; }
  .corner-tl { top: 20px; left: 20px; border-top: 1px solid var(--orange); border-left: 1px solid var(--orange); }
  .corner-tr { top: 20px; right: 20px; border-top: 1px solid var(--orange); border-right: 1px solid var(--orange); }
  .corner-bl { bottom: 20px; left: 20px; border-bottom: 1px solid var(--orange); border-left: 1px solid var(--orange); }
  .corner-br { bottom: 20px; right: 20px; border-bottom: 1px solid var(--orange); border-right: 1px solid var(--orange); }

  @media (max-width: 768px) {
    main { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    aside { border-right: none; border-bottom: 1px solid var(--border); max-height: 40vh; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">WIRE<span>FRAME</span></div>
  <div class="header-right">
    <div class="fps-badge">
      <div class="fps-dot" id="fpsDot"></div>
      <span id="fpsLabel">OFFLINE</span>
    </div>
    <div class="header-tag">AESTHETIC ENGINE v2.5</div>
  </div>
</header>

<main>
  <aside>
    <div class="section-label">Source</div>
    <div class="mode-switch">
      <button class="mode-btn active" id="btnModeWebcam">WEBCAM</button>
      <button class="mode-btn" id="btnModeFile">FILE</button>
    </div>

    <!-- Webcam UI -->
    <div class="source-panel visible" id="panelWebcam">
      <div class="webcam-preview">
        <video id="videoEl" autoplay muted playsinline></video>
        <div class="scan-line" id="scanLine"></div>
        <svg class="webcam-overlay" viewBox="0 0 160 120">
          <path d="M10,25 V10 H25 M135,10 H150 V25 M150,95 V110 H135 M25,110 H10 V95" fill="none" stroke="#c8732a" stroke-width="0.5" opacity="0.5"/>
        </svg>
        <div class="webcam-status" id="webcamStatus">NO SIGNAL</div>
      </div>
      <button class="btn btn-primary" id="startCamBtn">START CAMERA</button>
      <button class="btn btn-danger" id="stopCamBtn" style="display:none">STOP SIGNAL</button>
    </div>

    <!-- File UI -->
    <div class="source-panel" id="panelFile">
      <div class="drop-zone" id="dropZone">
        <svg class="drop-zone-icon" viewBox="0 0 24 24" stroke="currentColor">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <polyline points="21 15 16 10 5 21"/>
        </svg>
        <div class="drop-zone-text">DRAG IMAGE<br>or click</div>
        <img class="drop-zone-thumb" id="thumbImg"/>
      </div>
      <input type="file" id="fileInput" accept="image/*">
      <button class="btn btn-primary" id="renderBtn" disabled>PROCESS IMAGE</button>
    </div>

    <div class="section-label">Aesthetic Filters</div>
    <div class="control-group">
      <div class="toggle-row">
        <span class="toggle-label" title="Assumes subject is in center">Foreground Focus</span>
        <button class="toggle on" id="focusToggle"></button>
      </div>
      <div class="control-row">
        <div class="control-header"><span class="control-name">Edge Sensitivity</span><span class="control-val" id="edgeVal">45</span></div>
        <input type="range" id="edgeThreshold" min="5" max="120" value="45">
      </div>
      <div class="control-row">
        <div class="control-header"><span class="control-name">Density</span><span class="control-val" id="whiteVal">400</span></div>
        <input type="range" id="whiteLines" min="50" max="1500" value="400" step="10">
      </div>
      <div class="control-row">
        <div class="control-header"><span class="control-name">Line Length</span><span class="control-val" id="lenVal">60</span></div>
        <input type="range" id="lineLength" min="5" max="250" value="60">
      </div>
      <div class="control-row">
        <div class="control-header"><span class="control-name">Detail Noise</span><span class="control-val" id="triVal">35</span></div>
        <input type="range" id="triCount" min="0" max="150" value="35">
      </div>
      <div class="control-row">
        <div class="control-header"><span class="control-name">Persistence</span><span class="control-val" id="fadeVal">0.10</span></div>
        <input type="range" id="fadeAmount" min="2" max="50" value="10">
      </div>
      <div class="toggle-row">
        <span class="toggle-label">Mirror View</span>
        <button class="toggle on" id="mirrorToggle"></button>
      </div>
      <div class="toggle-row">
        <span class="toggle-label">Nodes</span>
        <button class="toggle on" id="nodesToggle"></button>
      </div>
    </div>

    <button class="btn btn-ghost" style="margin-top:auto" id="downloadBtn" disabled>DOWNLOAD FRAME</button>
  </aside>

  <div class="canvas-area">
    <div class="corner corner-tl"></div><div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div><div class="corner corner-br"></div>
    <div class="placeholder-ui" id="placeholder">
       <svg width="60" height="60" viewBox="0 0 100 100" stroke="#333" stroke-width="0.5" fill="none">
         <polygon points="50,5 95,25 95,75 50,95 5,75 5,25"/>
         <line x1="50" y1="5" x2="50" y2="95"/><line x1="5" y1="25" x2="95" y2="75"/><line x1="95" y1="25" x2="5" y2="75"/>
       </svg>
       <p>WAITING FOR INPUT</p>
    </div>
    <canvas id="outputCanvas" style="display:none;"></canvas>
  </div>
</main>

<canvas id="srcCanvas" style="display:none;"></canvas>

<script>
/**
 * WIREFRAME ENGINE v2.6 - FOCUS UPDATE
 * Implements radial-weighted thresholding to emphasize foreground figures.
 */

let state = {
  mode: 'webcam',
  stream: null,
  animFrame: null,
  sourceImage: null,
  nodesEnabled: true,
  mirrorEnabled: true,
  focusEnabled: true,
  frameCount: 0,
  lastFpsUpdate: performance.now()
};

const els = {
  video: document.getElementById('videoEl'),
  output: document.getElementById('outputCanvas'),
  src: document.getElementById('srcCanvas'),
  placeholder: document.getElementById('placeholder'),
  webcamStatus: document.getElementById('webcamStatus'),
  scanLine: document.getElementById('scanLine'),
  fpsDot: document.getElementById('fpsDot'),
  fpsLabel: document.getElementById('fpsLabel'),
  fileInput: document.getElementById('fileInput'),
  thumb: document.getElementById('thumbImg')
};

const sliders = [
  ['edgeThreshold', 'edgeVal', v => v],
  ['whiteLines', 'whiteVal', v => v],
  ['lineLength', 'lenVal', v => v],
  ['triCount', 'triVal', v => v],
  ['fadeAmount', 'fadeVal', v => (v/100).toFixed(2)]
];

sliders.forEach(([id, displayId, formatter]) => {
  const el = document.getElementById(id);
  const disp = document.getElementById(displayId);
  el.oninput = () => disp.textContent = formatter(el.value);
});

document.getElementById('btnModeWebcam').onclick = () => switchMode('webcam');
document.getElementById('btnModeFile').onclick = () => switchMode('file');

function switchMode(newMode) {
  if (state.mode === newMode) return;
  state.mode = newMode;
  document.getElementById('btnModeWebcam').classList.toggle('active', newMode === 'webcam');
  document.getElementById('btnModeFile').classList.toggle('active', newMode === 'file');
  document.getElementById('panelWebcam').classList.toggle('visible', newMode === 'webcam');
  document.getElementById('panelFile').classList.toggle('visible', newMode === 'file');
  stopAll();
  resetDisplay();
}

document.getElementById('startCamBtn').onclick = startCamera;
document.getElementById('stopCamBtn').onclick = stopCamera;

async function startCamera() {
  try {
    state.stream = await navigator.mediaDevices.getUserMedia({
      video: { width: 1280, height: 720 },
      audio: false
    });
    els.video.srcObject = state.stream;
    els.video.style.display = 'block';
    await els.video.play();
    els.webcamStatus.textContent = 'ACTIVE SIGNAL';
    els.scanLine.classList.add('active');
    document.getElementById('startCamBtn').style.display = 'none';
    document.getElementById('stopCamBtn').style.display = 'flex';
    document.getElementById('downloadBtn').disabled = false;
    initCanvas(els.video.videoWidth, els.video.videoHeight);
    els.placeholder.style.display = 'none';
    els.output.style.display = 'block';
    startLoop();
  } catch (err) {
    els.webcamStatus.textContent = 'ACCESS DENIED';
  }
}

function stopCamera() {
  if (state.stream) {
    state.stream.getTracks().forEach(t => t.stop());
    state.stream = null;
  }
  els.video.style.display = 'none';
  els.video.srcObject = null;
  els.scanLine.classList.remove('active');
  els.webcamStatus.textContent = 'NO SIGNAL';
  document.getElementById('startCamBtn').style.display = 'flex';
  document.getElementById('stopCamBtn').style.display = 'none';
  setLiveStatus(false);
}

document.getElementById('dropZone').onclick = () => els.fileInput.click();
els.fileInput.onchange = (e) => handleFile(e.target.files[0]);

function handleFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      state.sourceImage = img;
      els.thumb.src = e.target.result;
      els.thumb.style.display = 'block';
      document.getElementById('renderBtn').disabled = false;
      document.getElementById('downloadBtn').disabled = false;
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

document.getElementById('renderBtn').onclick = () => {
  if (!state.sourceImage) return;
  stopLoop();
  renderStatic();
};

function initCanvas(w, h) {
  const container = els.output.parentElement;
  const ratio = Math.min(container.clientWidth * 0.9 / w, container.clientHeight * 0.9 / h, 1);
  els.output.width = w * ratio;
  els.output.height = h * ratio;
  const ctx = els.output.getContext('2d');
  ctx.fillStyle = '#000';
  ctx.fillRect(0,0, els.output.width, els.output.height);
}

/**
 * ENHANCED EDGE DETECTION
 * Ignores background by increasing threshold as we move away from center
 * and applying a luminance bias (foregrounds usually have higher contrast).
 */
function detectEdges(pixels, w, h, baseThreshold) {
  const gray = new Float32Array(w * h);
  const lum = new Float32Array(w * h);
  
  for (let i = 0; i < w * h; i++) {
    const r = pixels[i*4], g = pixels[i*4+1], b = pixels[i*4+2];
    const brightness = (r * 0.3 + g * 0.59 + b * 0.11);
    gray[i] = brightness;
    lum[i] = brightness / 255; // Normalized
  }

  const points = [];
  const centerX = w / 2;
  const centerY = h / 2;
  const maxDist = Math.hypot(centerX, centerY);

  for (let y = 1; y < h - 1; y++) {
    for (let x = 1; x < w - 1; x++) {
      const idx = y * w + x;
      
      // Calculate local sensitivity
      let currentThreshold = baseThreshold;
      
      if (state.focusEnabled) {
        const dx = x - centerX;
        const dy = y - centerY;
        const dist = Math.hypot(dx, dy) / maxDist; // 0 to 1
        
        // Background rejection: Exponentially increase threshold towards edges
        // This keeps the center sensitive and the background "clean"
        currentThreshold += Math.pow(dist, 1.5) * 180; 
        
        // Luminance bias: Backgrounds are often darker/uniform. 
        // Enhance points that are brighter (likely part of figure).
        currentThreshold *= (1.5 - lum[idx]); 
      }

      const gx = -gray[idx-w-1] + gray[idx-w+1] - 2*gray[idx-1] + 2*gray[idx+1] - gray[idx+w-1] + gray[idx+w+1];
      const gy = -gray[idx-w-1] - 2*gray[idx-w] - gray[idx-w+1] + gray[idx+w-1] + 2*gray[idx+w] + gray[idx+w+1];
      const magnitude = Math.sqrt(gx*gx + gy*gy);

      if (magnitude > currentThreshold) {
        points.push([x, y]);
      }
    }
  }
  return points;
}

function drawFrame(ctx, points, scaleX, scaleY) {
  if (points.length < 5) return;

  const count = parseInt(document.getElementById('whiteLines').value);
  const maxLen = parseInt(document.getElementById('lineLength').value);
  const triCount = parseInt(document.getElementById('triCount').value);
  const pool = points.length;

  for (let i = 0; i < triCount; i++) {
    const p1 = points[Math.floor(Math.random() * pool)];
    const p2 = points[Math.floor(Math.random() * pool)];
    const p3 = points[Math.floor(Math.random() * pool)];
    ctx.strokeStyle = Math.random() > 0.6 ? 'rgba(200, 115, 42, 0.12)' : 'rgba(120, 120, 140, 0.08)';
    ctx.lineWidth = 0.5;
    ctx.beginPath();
    ctx.moveTo(p1[0]*scaleX, p1[1]*scaleY);
    ctx.lineTo(p2[0]*scaleX, p2[1]*scaleY);
    ctx.lineTo(p3[0]*scaleX, p3[1]*scaleY);
    ctx.closePath();
    ctx.stroke();
  }

  ctx.lineWidth = 0.6;
  for (let i = 0; i < count; i++) {
    const a = points[Math.floor(Math.random() * pool)];
    let b;
    let found = false;
    for(let att=0; att<6; att++){
        const cand = points[Math.floor(Math.random() * pool)];
        const d = Math.hypot((cand[0]-a[0])*scaleX, (cand[1]-a[1])*scaleY);
        if(d > 3 && d < maxLen) { b = cand; found = true; break; }
    }
    if(!found) {
        const ang = Math.random()*Math.PI*2;
        const l = Math.random()*maxLen*0.5;
        b = [a[0] + Math.cos(ang)*l/scaleX, a[1] + Math.sin(ang)*l/scaleY];
    }
    ctx.strokeStyle = `rgba(245, 245, 255, ${0.06 + Math.random()*0.18})`;
    ctx.beginPath();
    ctx.moveTo(a[0]*scaleX, a[1]*scaleY);
    ctx.lineTo(b[0]*scaleX, b[1]*scaleY);
    ctx.stroke();
    
    if(state.nodesEnabled && Math.random() > 0.985) {
        ctx.fillStyle = Math.random() > 0.8 ? '#e8923e' : '#ffffff';
        ctx.beginPath();
        ctx.arc(a[0]*scaleX, a[1]*scaleY, 1.4, 0, Math.PI*2);
        ctx.fill();
    }
  }
}

function startLoop() {
  setLiveStatus(true);
  const processW = 300; // Efficient processing size
  els.src.width = processW;

  const step = () => {
    if (state.mode !== 'webcam' || !state.stream) return;
    const vW = els.video.videoWidth;
    const vH = els.video.videoHeight;
    const processH = Math.round(processW * (vH / vW));
    els.src.height = processH;
    const sCtx = els.src.getContext('2d', { willReadFrequently: true });
    if (state.mirrorEnabled) {
      sCtx.save(); sCtx.translate(processW, 0); sCtx.scale(-1, 1);
      sCtx.drawImage(els.video, 0, 0, processW, processH);
      sCtx.restore();
    } else {
      sCtx.drawImage(els.video, 0, 0, processW, processH);
    }
    const imgData = sCtx.getImageData(0, 0, processW, processH);
    const pts = detectEdges(imgData.data, processW, processH, parseInt(document.getElementById('edgeThreshold').value));
    const ctx = els.output.getContext('2d');
    const fade = parseInt(document.getElementById('fadeAmount').value) / 100;
    ctx.fillStyle = `rgba(0,0,0,${fade})`;
    ctx.fillRect(0, 0, els.output.width, els.output.height);
    drawFrame(ctx, pts, els.output.width/processW, els.output.height/processH);
    updateFps();
    state.animFrame = requestAnimationFrame(step);
  };
  state.animFrame = requestAnimationFrame(step);
}

async function renderStatic() {
  const img = state.sourceImage;
  const maxDim = 900;
  let w = img.width, h = img.height;
  const scale = Math.min(maxDim/w, maxDim/h, 1);
  w *= scale; h *= scale;
  els.src.width = w; els.src.height = h;
  const sCtx = els.src.getContext('2d');
  sCtx.drawImage(img, 0, 0, w, h);
  const data = sCtx.getImageData(0, 0, w, h);
  const pts = detectEdges(data.data, w, h, parseInt(document.getElementById('edgeThreshold').value));
  initCanvas(w, h);
  els.placeholder.style.display = 'none';
  els.output.style.display = 'block';
  const ctx = els.output.getContext('2d');
  ctx.fillStyle = '#000'; ctx.fillRect(0,0, els.output.width, els.output.height);
  for(let i=0; i<12; i++) {
    drawFrame(ctx, pts, els.output.width/w, els.output.height/h);
    await new Promise(r => setTimeout(r, 16));
  }
}

function stopLoop() {
  if (state.animFrame) cancelAnimationFrame(state.animFrame);
}

function stopAll() {
  stopLoop();
  stopCamera();
}

function resetDisplay() {
  els.placeholder.style.display = 'flex';
  els.output.style.display = 'none';
  els.thumb.style.display = 'none';
  document.getElementById('renderBtn').disabled = true;
}

function setLiveStatus(live) {
  els.fpsDot.classList.toggle('live', live);
  if (!live) els.fpsLabel.textContent = 'OFFLINE';
}

function updateFps() {
  state.frameCount++;
  const now = performance.now();
  if (now - state.lastFpsUpdate >= 1000) {
    els.fpsLabel.textContent = `${state.frameCount} FPS`;
    state.frameCount = 0;
    state.lastFpsUpdate = now;
  }
}

document.getElementById('mirrorToggle').onclick = function() {
  state.mirrorEnabled = !state.mirrorEnabled;
  this.classList.toggle('on', state.mirrorEnabled);
};
document.getElementById('nodesToggle').onclick = function() {
  state.nodesEnabled = !state.nodesEnabled;
  this.classList.toggle('on', state.nodesEnabled);
};
document.getElementById('focusToggle').onclick = function() {
  state.focusEnabled = !state.focusEnabled;
  this.classList.toggle('on', state.focusEnabled);
};

document.getElementById('downloadBtn').onclick = () => {
  const link = document.createElement('a');
  link.download = `wireframe_focus_${Date.now()}.png`;
  link.href = els.output.toDataURL();
  link.click();
};
</script>
