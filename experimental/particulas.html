<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuvem de Partículas Reativa à Webcam</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            background: radial-gradient(circle at center, #8a2be2 0%, #4b0082 40%, #000033 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        #ui-layer {
            position: absolute;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            bottom: 30px;
            width: 100%;
            pointer-events: none; /* Deixar cliques passarem para o canvas onde não houver botões */
        }

        #instructions {
            color: rgba(255, 255, 255, 0.7);
            font-size: 16px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            text-align: center;
        }

        #camButton {
            pointer-events: auto;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.5);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }

        #camButton:hover {
            background: rgba(255, 255, 255, 0.4);
            transform: scale(1.05);
        }

        #camButton.active {
            background: rgba(50, 205, 50, 0.4);
            border-color: #32cd32;
        }

        /* O vídeo fica escondido, usamos apenas os dados dele */
        video {
            display: none;
        }
    </style>
</head>
<body>

    <div id="ui-layer">
        <div id="instructions">Use o rato OU ative a webcam para usar as mãos</div>
        <button id="camButton">Ativar Webcam</button>
    </div>

    <canvas id="particleCanvas"></canvas>
    
    <!-- Elementos ocultos para processamento de vídeo -->
    <video id="video" playsinline autoplay muted></video>
    <canvas id="motionCanvas" style="display: none;"></canvas>

    <script>
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        const video = document.getElementById('video');
        const motionCanvas = document.getElementById('motionCanvas');
        const motionCtx = motionCanvas.getContext('2d', { willReadFrequently: true });
        const camButton = document.getElementById('camButton');
        const instructions = document.getElementById('instructions');

        let particlesArray;
        // Posição alvo (mouse ou movimento)
        let target = {
            x: null,
            y: null,
            radius: 150
        };

        let isWebcamActive = false;

        // Variáveis para deteção de movimento
        let previousFrameData = null;
        // Tamanho reduzido para processamento rápido (performance)
        const motionScale = 0.1; 

        // Ajustar tamanho do canvas
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            init();
        }

        window.addEventListener('resize', resizeCanvas);
        
        // Rastrear mouse (fallback quando não há movimento ou webcam)
        window.addEventListener('mousemove', function(event) {
            if (!isWebcamActive) {
                target.x = event.x;
                target.y = event.y;
            }
        });

        window.addEventListener('mouseout', function() {
            if (!isWebcamActive) {
                target.x = undefined;
                target.y = undefined;
            }
        });

        // Configuração da Webcam
        camButton.addEventListener('click', async () => {
            if (!isWebcamActive) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                    video.srcObject = stream;
                    isWebcamActive = true;
                    camButton.textContent = "Webcam Ativa (Mova as mãos!)";
                    camButton.classList.add('active');
                    instructions.textContent = "Mova-se para atrair as partículas!";
                    
                    // Configurar canvas de movimento quando o vídeo estiver pronto
                    video.onloadedmetadata = () => {
                        motionCanvas.width = video.videoWidth * motionScale;
                        motionCanvas.height = video.videoHeight * motionScale;
                    };
                } catch (err) {
                    console.error("Erro ao acessar webcam:", err);
                    alert("Não foi possível acessar a webcam. Verifique as permissões.");
                }
            }
        });

        function detectMotion() {
            if (!isWebcamActive || video.readyState !== 4) return;

            // Desenhar frame atual no canvas pequeno
            motionCtx.drawImage(video, 0, 0, motionCanvas.width, motionCanvas.height);
            
            const frameData = motionCtx.getImageData(0, 0, motionCanvas.width, motionCanvas.height);
            const data = frameData.data;
            const length = data.length;

            if (!previousFrameData) {
                previousFrameData = data;
                return;
            }

            let sumX = 0;
            let sumY = 0;
            let count = 0;

            // Loop pelos pixels (pulando de 4 em 4 para pegar RGBA)
            // Também podemos pular pixels para performance (step = 4 * 4 pixels)
            for (let i = 0; i < length; i += 16) {
                const r = data[i];
                const g = data[i + 1];
                const b = data[i + 2];

                const prevR = previousFrameData[i];
                const prevG = previousFrameData[i + 1];
                const prevB = previousFrameData[i + 2];

                // Calcular diferença simples
                const diff = Math.abs(r - prevR) + Math.abs(g - prevG) + Math.abs(b - prevB);

                // Se a diferença for significativa (limiar de movimento)
                if (diff > 50) {
                    const index = i / 4;
                    const x = index % motionCanvas.width;
                    const y = Math.floor(index / motionCanvas.width);

                    sumX += x;
                    sumY += y;
                    count++;
                }
            }

            previousFrameData = data;

            if (count > 10) { // Mínimo de pixels para considerar movimento válido
                // Média das posições de movimento
                const avgX = sumX / count;
                const avgY = sumY / count;

                // Mapear coordenadas do canvas pequeno para a tela cheia
                // IMPORTANTE: Inverter X para efeito de espelho (window.innerWidth - ...)
                const screenX = window.innerWidth - (avgX / motionCanvas.width) * window.innerWidth;
                const screenY = (avgY / motionCanvas.height) * window.innerHeight;

                // Suavização do movimento (Lerp) para não tremer
                if (target.x === null || target.x === undefined) {
                    target.x = screenX;
                    target.y = screenY;
                } else {
                    target.x += (screenX - target.x) * 0.1;
                    target.y += (screenY - target.y) * 0.1;
                }
            }
        }

        // Classe da Partícula
        class Particle {
            constructor(x, y, directionX, directionY, size, opacity) {
                this.x = x;
                this.y = y;
                this.directionX = directionX;
                this.directionY = directionY;
                this.size = size;
                this.baseX = x;
                this.baseY = y;
                this.opacity = opacity;
                this.density = (Math.random() * 30) + 1;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2, false);
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`; 
                ctx.fill();
            }

            update() {
                if (this.x > canvas.width || this.x < 0) this.directionX = -this.directionX;
                if (this.y > canvas.height || this.y < 0) this.directionY = -this.directionY;

                // Interação com target (mouse ou movimento)
                let dx, dy;
                
                if (target.x != null && target.y != null) {
                    dx = target.x - this.x;
                    dy = target.y - this.y;
                    let distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < target.radius + this.size) {
                        const forceDirectionX = dx / distance;
                        const forceDirectionY = dy / distance;
                        const maxDistance = target.radius;
                        const force = (maxDistance - distance) / maxDistance;
                        const directionX = forceDirectionX * force * this.density;
                        const directionY = forceDirectionY * force * this.density;

                        this.x -= directionX;
                        this.y -= directionY;
                    } else {
                        // Retorno suave à deriva original se não houver interação
                        if (this.x !== this.baseX) {
                            let dxBase = this.x - this.baseX;
                            this.x -= dxBase/50; // Velocidade de retorno
                        }
                        if (this.y !== this.baseY) {
                            let dyBase = this.y - this.baseY;
                            this.y -= dyBase/50;
                        }
                    }
                }

                this.x += this.directionX;
                this.y += this.directionY;
                this.draw();
            }
        }

        function init() {
            particlesArray = [];
            let numberOfParticles = (canvas.height * canvas.width) / 5000; 

            for (let i = 0; i < numberOfParticles; i++) {
                let size = (Math.random() * 3) + 1;
                let x = (Math.random() * ((innerWidth - size * 2) - (size * 2)) + size * 2);
                let y = (Math.random() * ((innerHeight - size * 2) - (size * 2)) + size * 2);
                let directionX = (Math.random() * 1) - 0.5;
                let directionY = (Math.random() * 1) - 0.5;
                let opacity = Math.random() * 0.5 + 0.1; 

                particlesArray.push(new Particle(x, y, directionX, directionY, size, opacity));
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            ctx.clearRect(0, 0, innerWidth, innerHeight);

            // Executar deteção de movimento a cada frame se webcam estiver ativa
            if (isWebcamActive) {
                detectMotion();
                
                // Desenhar indicador visual do movimento detectado (opcional, ajuda na usabilidade)
                if (target.x != null) {
                    ctx.beginPath();
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
                    ctx.lineWidth = 2;
                    ctx.arc(target.x, target.y, 20, 0, Math.PI*2);
                    ctx.stroke();
                }
            }

            connect(); 

            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
            }
        }

        function connect() {
            let opacityValue = 1;
            for (let a = 0; a < particlesArray.length; a++) {
                for (let b = a; b < particlesArray.length; b++) {
                    let distance = ((particlesArray[a].x - particlesArray[b].x) * (particlesArray[a].x - particlesArray[b].x)) + 
                                   ((particlesArray[a].y - particlesArray[b].y) * (particlesArray[a].y - particlesArray[b].y));
                    
                    if (distance < (canvas.width/7) * (canvas.height/7)) {
                        opacityValue = 1 - (distance/10000);
                        ctx.strokeStyle = 'rgba(255, 255, 255,' + (opacityValue * 0.05) + ')';
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(particlesArray[a].x, particlesArray[a].y);
                        ctx.lineTo(particlesArray[b].x, particlesArray[b].y);
                        ctx.stroke();
                    }
                }
            }
        }

        resizeCanvas(); 
        animate();

    </script>
</body>
</html>
