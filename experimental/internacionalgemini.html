<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Internacional - Construtivismo Digital & Gestos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    
    <!-- Bibliotecas MediaPipe para Visão Computacional (Rastreamento de Mãos) -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #050505;
            overflow: hidden;
            font-family: 'Oswald', sans-serif;
            user-select: none;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        canvas {
            display: block;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            padding: 5%;
            box-sizing: border-box;
            pointer-events: none;
            perspective: 1200px;
        }

        #poem-text {
            color: #f2e8c9;
            font-size: clamp(2rem, 4.5vw, 5.5rem);
            font-weight: 700;
            text-transform: uppercase;
            line-height: 1.1;
            max-width: 900px;
            opacity: 0;
            transform-style: preserve-3d;
            transition: opacity 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        #poem-text.visible {
            opacity: 1;
        }

        .line-wrapper {
            display: inline-block;
            text-shadow: 4px 4px 0px #8a0000, 8px 8px 0px #000000;
            animation: floatTremble 6s infinite alternate ease-in-out;
            transform-origin: center left;
        }

        .line-wrapper:nth-child(even) {
            animation-delay: -3s;
            animation-duration: 7s;
        }

        @keyframes floatTremble {
            0% { transform: translate3d(0px, 0px, 0px) skewX(-5deg) rotateY(0deg) rotateZ(0deg); }
            33% { transform: translate3d(10px, -5px, 20px) skewX(-7deg) rotateY(5deg) rotateZ(-1deg); }
            66% { transform: translate3d(-5px, 10px, -10px) skewX(-3deg) rotateY(-5deg) rotateZ(1deg); }
            100% { transform: translate3d(5px, 0px, 10px) skewX(-6deg) rotateY(2deg) rotateZ(0deg); }
        }

        .highlight-red {
            color: #e60000;
            display: inline-block;
            animation: pulseColor 4s infinite alternate;
        }

        @keyframes pulseColor {
            0% { color: #e60000; text-shadow: 4px 4px 0px #330000, 8px 8px 0px #000; }
            100% { color: #ff1a1a; text-shadow: 6px 6px 0px #550000, 10px 10px 0px #000; }
        }

        #instruction {
            position: absolute;
            bottom: 30px;
            right: 30px;
            color: #e60000;
            font-size: 1.2rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            animation: pulse 2s infinite;
            text-shadow: 2px 2px 0px #000;
            pointer-events: auto;
            cursor: pointer;
            z-index: 4;
            background: rgba(0,0,0,0.5);
            padding: 10px;
            border: 1px solid #e60000;
            text-align: right;
            max-width: 400px;
        }

        @keyframes pulse {
            0% { opacity: 0.5; box-shadow: 0 0 0 0 rgba(230,0,0,0.4); }
            50% { opacity: 1; box-shadow: 0 0 15px 5px rgba(230,0,0,0); }
            100% { opacity: 0.5; box-shadow: 0 0 0 0 rgba(230,0,0,0); }
        }

        .noise-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            pointer-events: none;
            opacity: 0.05;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }
    </style>
</head>
<body>

    <div id="canvas-container">
        <canvas id="mainCanvas"></canvas>
    </div>

    <div id="ui-layer">
        <div id="poem-text"></div>
    </div>
    
    <div id="instruction" onclick="triggerInitialClick(event)">CLIQUE PARA INICIAR<br><span style="font-size:0.8rem; color:#f2e8c9;">(ATIVARÁ ÁUDIO E WEBCAM PARA GESTOS)</span></div>
    <div class="noise-overlay"></div>

    <!-- Elemento de vídeo oculto para processamento do MediaPipe -->
    <video id="webcam-video" playsinline autoplay style="display: none;"></video>

    <script>
        // --- SISTEMA DE ÁUDIO RECONSTRUÍDO (Drone Suave e Etéreo) ---
        let audioCtx;
        let masterGain;
        let delay;
        let audioInitialized = false;

        function initAudio() {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();

            masterGain = audioCtx.createGain();
            masterGain.gain.value = 0.2; 
            masterGain.connect(audioCtx.destination);

            // Aumento ligeiro no eco para maior fluidez ambiental
            delay = audioCtx.createDelay();
            delay.delayTime.value = 0.8;
            const delayFeedback = audioCtx.createGain();
            delayFeedback.gain.value = 0.5;
            delay.connect(delayFeedback);
            delayFeedback.connect(delay);
            delay.connect(masterGain);

            function createDrone(freq, type, vol) {
                const osc = audioCtx.createOscillator();
                osc.type = type;
                osc.frequency.value = freq;
                
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.value = 150; // Muito fechado e profundo

                const gain = audioCtx.createGain();
                gain.gain.value = vol;

                osc.connect(filter);
                filter.connect(gain);
                gain.connect(masterGain);
                osc.start();
            }
            
            // Drone de fundo profundo e purificado (sem sawtooth nem square)
            createDrone(65.41, 'sine', 0.4); 
            createDrone(98.00, 'triangle', 0.1);

            const bpm = 100;
            const t = 60000 / bpm;
            
            // Pauta Fiel da Melodia
            const melody = [
                { n: 196.00, d: t * 1 }, { n: 261.63, d: t * 1.5 }, { n: 261.63, d: t * 0.5 }, { n: 246.94, d: t * 1 }, { n: 220.00, d: t * 1 }, { n: 196.00, d: t * 2 }, { n: 164.81, d: t * 2 },
                { n: 220.00, d: t * 1.5 }, { n: 220.00, d: t * 0.5 }, { n: 196.00, d: t * 1 }, { n: 174.61, d: t * 1 }, { n: 164.81, d: t * 2 }, { n: 146.83, d: t * 2 },
                { n: 196.00, d: t * 1.5 }, { n: 220.00, d: t * 0.5 }, { n: 246.94, d: t * 1 }, { n: 261.63, d: t * 1 }, { n: 293.66, d: t * 1.5 }, { n: 329.63, d: t * 0.5 }, { n: 261.63, d: t * 2 },
                { n: 293.66, d: t * 1.5 }, { n: 261.63, d: t * 0.5 }, { n: 246.94, d: t * 1 }, { n: 220.00, d: t * 1 }, { n: 246.94, d: t * 1 }, { n: 261.63, d: t * 3 },
                { n: 0, d: t * 2 }
            ];
            
            let noteIndex = 0;

            function playNextNote() {
                const nextNote = melody[noteIndex];
                
                if (nextNote.n > 0) {
                    const now = audioCtx.currentTime;
                    const durationInSeconds = nextNote.d / 1000;

                    // ONDA: Apenas onda "sine" (senoidal) para uma suavidade absoluta
                    const osc1 = audioCtx.createOscillator();
                    osc1.type = 'sine';
                    osc1.frequency.value = nextNote.n;
                    
                    // FILTRO: Suave e fechado, sem nenhuma ressonância (Q)
                    const filter = audioCtx.createBiquadFilter();
                    filter.type = 'lowpass';
                    filter.frequency.value = 600; 
                    
                    // ENVELOPE: Attack muito longo e lento (sobe devagar) e Release longo (desce devagar misturando-se)
                    const noteGain = audioCtx.createGain();
                    noteGain.gain.setValueAtTime(0, now);
                    noteGain.gain.linearRampToValueAtTime(0.4, now + 0.2); 
                    noteGain.gain.setValueAtTime(0.4, now + durationInSeconds - 0.2); 
                    noteGain.gain.linearRampToValueAtTime(0, now + durationInSeconds + 0.5); 

                    // Conexões simples
                    osc1.connect(filter);
                    filter.connect(noteGain);
                    noteGain.connect(delay); 
                    noteGain.connect(masterGain);
                    
                    osc1.start(now);
                    // O tempo de fim compensa o tempo do release longo
                    osc1.stop(now + durationInSeconds + 0.6); 
                }

                noteIndex = (noteIndex + 1) % melody.length;
                setTimeout(playNextNote, nextNote.d);
            }

            playNextNote();
            audioInitialized = true;
            playThud();
        }

        function playThud() {
            if(!audioCtx) return;
            const t = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = 'sine';
            osc.frequency.setValueAtTime(150, t);
            osc.frequency.exponentialRampToValueAtTime(10, t + 0.8);
            
            gain.gain.setValueAtTime(0.7, t);
            gain.gain.exponentialRampToValueAtTime(0.01, t + 0.8);
            
            osc.connect(gain);
            gain.connect(masterGain);
            
            osc.start(t);
            osc.stop(t + 0.8);
        }

        // --- SISTEMA DE GESTOS (MEDIAPIPE) ---
        const videoElement = document.getElementById('webcam-video');
        let handDetected = false;
        let lastGestureWasFist = false;
        let gestureCooldown = 0;
        let trackerInitialized = false;

        function initWebcamTracker() {
            if (trackerInitialized) return;
            trackerInitialized = true;

            const instructionEl = document.getElementById('instruction');
            instructionEl.innerHTML = 'A INICIAR MODELO DE VISÃO...<br><span style="font-size:0.8rem; color:#f2e8c9;">POR FAVOR AGUARDE</span>';

            const hands = new Hands({locateFile: (file) => {
                return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
            }});

            hands.setOptions({
                maxNumHands: 1,
                modelComplexity: 1,
                minDetectionConfidence: 0.6,
                minTrackingConfidence: 0.6
            });

            function getDistance(p1, p2) {
                return Math.sqrt(Math.pow(p1.x - p2.x, 2) + Math.pow(p1.y - p2.y, 2) + Math.pow(p1.z - p2.z, 2));
            }

            function isFist(landmarks) {
                let foldedCount = 0;
                const tips = [8, 12, 16, 20]; 
                const pips = [6, 10, 14, 18]; 
                const wrist = landmarks[0];
                
                for(let i=0; i<4; i++) {
                    let dTip = getDistance(landmarks[tips[i]], wrist);
                    let dPip = getDistance(landmarks[pips[i]], wrist);
                    if(dTip < dPip) foldedCount++;
                }
                return foldedCount >= 3; 
            }

            hands.onResults((results) => {
                if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                    handDetected = true;
                    instructionEl.style.opacity = '0.2';
                    instructionEl.innerHTML = 'MOVA O DEDO PARA ATRAIR<br><span style="font-size:0.8rem; color:#f2e8c9;">FECHE A MÃO PARA AVANÇAR</span>';

                    const landmarks = results.multiHandLandmarks[0];
                    const indexTip = landmarks[8];
                    mouseX = (1 - indexTip.x) * width;
                    mouseY = indexTip.y * height;

                    const fist = isFist(landmarks);
                    
                    if (Date.now() - gestureCooldown > 1200) { 
                        if (fist && !lastGestureWasFist) {
                            handleInteraction(mouseX, mouseY);
                            gestureCooldown = Date.now();
                        }
                    }
                    lastGestureWasFist = fist;

                } else {
                    handDetected = false;
                    mouseX = -1000;
                    mouseY = -1000;
                }
            });

            const camera = new Camera(videoElement, {
                onFrame: async () => {
                    await hands.send({image: videoElement});
                },
                width: 640,
                height: 480
            });
            camera.start();
        }

        // --- SISTEMA DE VISUALIZAÇÃO E POEMA ---
        const poemStanzas = [
            "<span class='line-wrapper'>De pé, <span class='highlight-red'>ó vítimas da fome!</span></span><br><span class='line-wrapper'>De pé, famélicos da terra!</span>",
            "<span class='line-wrapper'>Da ideia a chama já consome</span><br><span class='line-wrapper'>A crosta bruta que a soterra.</span>",
            "<span class='line-wrapper'><span class='highlight-red'>Cortai o mal</span> bem pelo fundo!</span><br><span class='line-wrapper'>De pé, de pé, não mais senhores!</span>",
            "<span class='line-wrapper'>Se nada somos neste mundo,</span><br><span class='line-wrapper'><span class='highlight-red'>Sejamos tudo</span>, oh produtores!</span>",
            "<span class='line-wrapper'>Bem unidos façamos,</span><br><span class='line-wrapper'>Nesta luta final,</span>",
            "<span class='line-wrapper'>Duma Terra sem amos</span><br><span class='line-wrapper'><span class='highlight-red'>A Internacional.</span></span>",
            "<span class='line-wrapper'>Messias, Deus, chefes supremos,</span><br><span class='line-wrapper'>Nada esperemos de nenhum!</span>",
            "<span class='line-wrapper'>Sejamos nós quem conquistemos</span><br><span class='line-wrapper'><span class='highlight-red'>A Terra-Mãe</span> livre e comum!</span>",
            "<span class='line-wrapper'>Para não ter protestos vãos,</span><br><span class='line-wrapper'>Para sair deste antro estreito,</span>",
            "<span class='line-wrapper'>Façamos nós <span class='highlight-red'>por nossas mãos</span>,</span><br><span class='line-wrapper'>Tudo o que a nós diz respeito!</span>"
        ];

        let currentStanza = 0;
        const poemElement = document.getElementById('poem-text');

        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        
        let electrons = [];
        const numElectrons = 150;
        let mouseX = -1000;
        let mouseY = -1000;

        const angles = [0, Math.PI/4, Math.PI/2, 3*Math.PI/4, Math.PI, 5*Math.PI/4, 3*Math.PI/2, 7*Math.PI/4];
        const colors = ['#e60000', '#f2e8c9', '#8a0000', '#ffffff'];

        let backgroundShapes = [];
        let crowdSilhouettes = [];
        let currentBackgroundTheme = 0;

        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            generateBackgroundGeometry();
        }
        window.addEventListener('resize', resizeCanvas);

        class Electron {
            constructor(x, y, isBurst = false) {
                this.x = x || Math.random() * width;
                this.y = y || Math.random() * height;
                this.baseSpeed = (Math.random() * 2) + 1;
                this.speed = isBurst ? this.baseSpeed * 5 : this.baseSpeed;
                this.angle = angles[Math.floor(Math.random() * angles.length)];
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.radius = Math.random() * 2 + 1;
                this.life = isBurst ? 100 : Infinity;
            }

            update() {
                if (this.speed > this.baseSpeed) this.speed *= 0.95;

                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed;

                if (Math.random() < 0.02) {
                    this.angle = angles[Math.floor(Math.random() * angles.length)];
                }

                let dxM = mouseX - this.x;
                let dyM = mouseY - this.y;
                if (Math.sqrt(dxM*dxM + dyM*dyM) < 150) {
                    this.x += dxM * 0.02;
                    this.y += dyM * 0.02;
                }

                if (this.x < 0) this.x = width;
                if (this.x > width) this.x = 0;
                if (this.y < 0) this.y = height;
                if (this.y > height) this.y = 0;

                this.life--;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
            }
        }

        // --- SISTEMA DE FUNDOS CONSTRUTIVISTAS VARIÁVEIS ---
        function generateBackgroundGeometry() {
            backgroundShapes = [];
            crowdSilhouettes = [];

            // Existem 4 temas/composições abstratas diferentes
            if (currentBackgroundTheme === 0) {
                // Tema 0: O Sol Clássico e Raios Diagonais
                backgroundShapes.push({ type: 'circle', x: width * 0.5, y: height * 0.4, r: Math.min(width, height) * 0.35, color: '#e60000', outline: true });
                for (let i = 0; i < 4; i++) {
                    backgroundShapes.push({
                        type: 'polygon',
                        points: [{x: Math.random() * width, y: 0}, {x: Math.random() * width, y: height}, {x: Math.random() * width + 200, y: height}, {x: Math.random() * width + 200, y: 0}],
                        color: Math.random() > 0.5 ? 'rgba(138, 0, 0, 0.4)' : 'rgba(10, 10, 10, 0.8)'
                    });
                }
                generateCrowd(0.4);

            } else if (currentBackgroundTheme === 1) {
                // Tema 1: A Cunha Vermelha (Baseado em El Lissitzky)
                backgroundShapes.push({ type: 'circle', x: width * 0.7, y: height * 0.6, r: Math.min(width, height) * 0.25, color: '#f2e8c9', outline: false }); // Círculo branco sujo
                backgroundShapes.push({
                    type: 'polygon', // A grande cunha
                    points: [{x: -100, y: -100}, {x: width * 0.75, y: height * 0.65}, {x: -100, y: height + 100}],
                    color: '#e60000'
                });
                backgroundShapes.push({
                    type: 'polygon', // Bloco escuro de contraste
                    points: [{x: width * 0.5, y: height}, {x: width, y: 0}, {x: width, y: height}],
                    color: '#0a0a0a'
                });
                generateCrowd(0.2); // Multidão mais pequena

            } else if (currentBackgroundTheme === 2) {
                // Tema 2: Linhas Fabris Pesadas e Ângulos Retos (A Máquina)
                for (let i = 0; i < 6; i++) {
                    const isVertical = Math.random() > 0.5;
                    const w = isVertical ? (Math.random() * 150 + 50) : width * 1.5;
                    const h = isVertical ? height * 1.5 : (Math.random() * 150 + 50);
                    const x = isVertical ? (Math.random() * width) : -100;
                    const y = isVertical ? -100 : (Math.random() * height);
                    
                    backgroundShapes.push({
                        type: 'rect', x: x, y: y, w: w, h: h,
                        color: ['#e60000', '#8a0000', '#0a0a0a', '#111'][Math.floor(Math.random() * 4)]
                    });
                }
                backgroundShapes.push({ type: 'circle', x: width * 0.2, y: height * 0.2, r: 80, color: '#e60000', outline: true });
                generateCrowd(0.5);

            } else if (currentBackgroundTheme === 3) {
                // Tema 3: Interseções Radicais e Círculos Suspensos
                backgroundShapes.push({ type: 'circle', x: width * 0.8, y: height * 0.3, r: 150, color: '#8a0000', outline: false });
                backgroundShapes.push({ type: 'circle', x: width * 0.3, y: height * 0.7, r: 200, color: '#e60000', outline: true });
                
                for (let i = 0; i < 5; i++) {
                    backgroundShapes.push({
                        type: 'polygon', // Lâminas diagonais cortantes
                        points: [{x: Math.random() * width - 500, y: 0}, {x: Math.random() * width, y: height}, {x: Math.random() * width + 50, y: height}, {x: Math.random() * width - 450, y: 0}],
                        color: 'rgba(242, 232, 201, 0.15)' // Linhas claras
                    });
                }
                generateCrowd(0.3);
            }
        }

        function generateCrowd(heightMultiplier) {
            let currentX = 0;
            while (currentX < width) {
                let w = Math.random() * 40 + 10;
                let h = Math.random() * (height * heightMultiplier) + 50;
                if(Math.random() < 0.1) h += 100; // Mastros/Bandeiras
                crowdSilhouettes.push({ x: currentX, y: height - h, w: w, h: h });
                currentX += w;
            }
        }

        function drawBackground() {
            ctx.fillStyle = '#050505';
            ctx.fillRect(0, 0, width, height);

            backgroundShapes.forEach(shape => {
                if (shape.type === 'circle') {
                    ctx.beginPath(); ctx.arc(shape.x, shape.y, shape.r, 0, Math.PI * 2); ctx.fillStyle = shape.color; ctx.fill();
                    if(shape.outline) {
                        ctx.beginPath(); ctx.arc(shape.x, shape.y, shape.r * 1.2, 0, Math.PI * 2); 
                        ctx.strokeStyle = 'rgba(230, 0, 0, 0.3)'; ctx.lineWidth = 2; ctx.stroke();
                    }
                } else if (shape.type === 'polygon') {
                    ctx.beginPath(); ctx.moveTo(shape.points[0].x, shape.points[0].y);
                    for (let i = 1; i < shape.points.length; i++) ctx.lineTo(shape.points[i].x, shape.points[i].y);
                    ctx.fillStyle = shape.color; ctx.fill();
                } else if (shape.type === 'rect') {
                    ctx.fillStyle = shape.color;
                    ctx.fillRect(shape.x, shape.y, shape.w, shape.h);
                }
            });
        }

        function drawCrowd() {
            ctx.fillStyle = '#000000';
            crowdSilhouettes.forEach(rect => {
                ctx.fillRect(rect.x, rect.y, rect.w, rect.h);
                if(Math.random() < 0.05) {
                    ctx.fillStyle = '#e60000';
                    ctx.fillRect(rect.x + rect.w/2 - 2, rect.y + 10, 4, 4);
                    ctx.fillStyle = '#000000'; 
                }
            });
        }

        function updateAndDrawNetwork() {
            for (let i = 0; i < electrons.length; i++) {
                let e1 = electrons[i];
                for (let j = i + 1; j < electrons.length; j++) {
                    let e2 = electrons[j];
                    let dx = e1.x - e2.x; let dy = e1.y - e2.y;
                    let dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < 120) {
                        ctx.beginPath(); ctx.moveTo(e1.x, e1.y); ctx.lineTo(e2.x, e2.y);
                        let opacity = 1 - (dist / 120);
                        ctx.strokeStyle = (e1.color === '#e60000' || e2.color === '#e60000') 
                            ? `rgba(230, 0, 0, ${opacity * 0.8})` : `rgba(242, 232, 201, ${opacity * 0.3})`;
                        ctx.lineWidth = opacity * 1.5; ctx.stroke();
                    }
                }
            }

            for (let i = electrons.length - 1; i >= 0; i--) {
                let e = electrons[i];
                e.update(); e.draw();
                if (e.life <= 0) electrons.splice(i, 1);
            }

            if (handDetected && mouseX > 0) {
                ctx.beginPath();
                ctx.arc(mouseX, mouseY, 8, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(230, 0, 0, 0.4)';
                ctx.fill();
                ctx.lineWidth = 1;
                ctx.strokeStyle = '#e60000';
                ctx.stroke();
            }
        }

        function animate() {
            drawBackground();
            drawCrowd(); 
            updateAndDrawNetwork(); 
            requestAnimationFrame(animate);
        }

        window.addEventListener('mousemove', (e) => { 
            if(!handDetected) { 
                mouseX = e.clientX; mouseY = e.clientY; 
            }
        });
        window.addEventListener('mouseout', () => { 
            if(!handDetected) { mouseX = -1000; mouseY = -1000; }
        });

        function triggerInitialClick(e) { 
            if(!audioInitialized) {
                initAudio();
                initWebcamTracker();
                handleInteraction(e.clientX || width/2, e.clientY || height/2);
            }
        }

        window.addEventListener('click', (e) => {
            if(!audioInitialized) {
                triggerInitialClick(e);
            } else if (e.target.id !== 'instruction') {
                handleInteraction(e.clientX, e.clientY);
            }
        });
        
        window.addEventListener('touchstart', (e) => {
            if(e.touches.length > 0) {
                if(!audioInitialized) {
                    triggerInitialClick(e.touches[0]);
                } else {
                    handleInteraction(e.touches[0].clientX, e.touches[0].clientY);
                }
            }
        });

        function handleInteraction(x, y) {
            if (audioInitialized) playThud();

            for (let i = 0; i < 30; i++) electrons.push(new Electron(x, y, true));
            updatePoemText();
            
            // Avança para a próxima composição geométrica abstrata construtivista
            currentBackgroundTheme = (currentBackgroundTheme + 1) % 4;
            generateBackgroundGeometry();
        }

        function updatePoemText() {
            poemElement.classList.remove('visible');
            setTimeout(() => {
                poemElement.innerHTML = poemStanzas[currentStanza];
                poemElement.classList.add('visible');
                currentStanza = (currentStanza + 1) % poemStanzas.length;
            }, 400); 
        }

        resizeCanvas();
        for (let i = 0; i < numElectrons; i++) electrons.push(new Electron());
        updatePoemText();
        animate();

    </script>
</body>
</html>
