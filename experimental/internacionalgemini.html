<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Internacional - Construtivismo Digital</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Utilização da fonte Oswald para um visual de poster construtivista forte e imponente -->
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #050505;
            overflow: hidden;
            font-family: 'Oswald', sans-serif;
            user-select: none;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        canvas {
            display: block;
        }

        /* Interface de Texto e Poema */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            padding: 5%;
            box-sizing: border-box;
            pointer-events: none; /* Permite que os cliques passem para o canvas */
        }

        #poem-text {
            color: #f2e8c9; /* Tom de papel envelhecido/bege */
            font-size: clamp(2rem, 4vw, 5rem);
            font-weight: 700;
            text-transform: uppercase;
            line-height: 1.2;
            max-width: 800px;
            text-shadow: 4px 4px 0px #8a0000, 8px 8px 0px #000000;
            opacity: 0;
            transform: translateY(20px) skewX(-5deg);
            transition: all 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        #poem-text.visible {
            opacity: 1;
            transform: translateY(0) skewX(-5deg);
        }

        .highlight-red {
            color: #e60000;
        }

        #instruction {
            position: absolute;
            bottom: 30px;
            right: 30px;
            color: #e60000;
            font-size: 1.2rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            animation: pulse 2s infinite;
            text-shadow: 2px 2px 0px #000;
            pointer-events: auto;
            cursor: pointer;
        }

        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }

        /* Ruído de fundo (textura) */
        .noise-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            pointer-events: none;
            opacity: 0.05;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }
    </style>
</head>
<body>

    <div id="canvas-container">
        <canvas id="mainCanvas"></canvas>
    </div>

    <div id="ui-layer">
        <div id="poem-text"></div>
    </div>
    
    <div id="instruction" onclick="triggerClick(event)">CLIQUE PARA AVANÇAR E GERAR ENERGIA</div>
    <div class="noise-overlay"></div>

    <script>
        // --- SISTEMA DE ÁUDIO (Drone Eletrónico & A Internacional) ---
        let audioCtx;
        let masterGain;
        let delay;
        let audioInitialized = false;

        function initAudio() {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();

            // Volume Principal Suave
            masterGain = audioCtx.createGain();
            masterGain.gain.value = 0.15; // Drone ambiente muito suave
            masterGain.connect(audioCtx.destination);

            // Efeito de Delay/Eco para criar um ambiente vasto (caverna/fábrica)
            delay = audioCtx.createDelay();
            delay.delayTime.value = 0.85;
            const delayFeedback = audioCtx.createGain();
            delayFeedback.gain.value = 0.65;
            delay.connect(delayFeedback);
            delayFeedback.connect(delay);
            delay.connect(masterGain);

            // Função para criar camadas do Drone Base
            function createDrone(freq, type, detune, filterBase, filterSweep) {
                const osc = audioCtx.createOscillator();
                osc.type = type;
                osc.frequency.value = freq;
                osc.detune.value = detune;

                // LFO (Low Frequency Oscillator) para fazer o som "respirar"
                const lfo = audioCtx.createOscillator();
                lfo.type = 'sine';
                lfo.frequency.value = 0.05 + Math.random() * 0.1;

                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.value = filterBase; 

                const lfoGain = audioCtx.createGain();
                lfoGain.gain.value = filterSweep; 
                lfo.connect(lfoGain);
                lfoGain.connect(filter.frequency);

                const oscGain = audioCtx.createGain();
                oscGain.gain.value = 0.4;

                osc.connect(filter);
                filter.connect(oscGain);
                oscGain.connect(masterGain);
                oscGain.connect(delay); // Passa o drone no delay também

                osc.start();
                lfo.start();
            }

            // Camadas do Drone Base (Dissonância industrial, grave e profunda)
            createDrone(65.41, 'sawtooth', 0, 150, 100);    // C2 (Nota Dó base)
            createDrone(65.41, 'square', 15, 200, 150);     // C2 desafinado
            createDrone(98.00, 'triangle', -10, 250, 100);  // G2 (Quinta, cria peso e tensão)

            // Melodia Etérea (Pauta completa do refrão de "A Internacional")
            const t = 750; // Tempo base (multiplicador de milissegundos)
            const melody = [
                { f: 196.00, dur: t * 1 },     // (Sol) Bem...
                { f: 261.63, dur: t * 1.5 },   // (Dó)  u-
                { f: 261.63, dur: t * 0.5 },   // (Dó)  ni-
                { f: 246.94, dur: t * 1 },     // (Si)  dos
                { f: 220.00, dur: t * 1 },     // (Lá)  fa-
                { f: 196.00, dur: t * 2 },     // (Sol) ça-
                { f: 164.81, dur: t * 2 },     // (Mi)  mos
                
                { f: 220.00, dur: t * 1.5 },   // (Lá)  Nes-
                { f: 220.00, dur: t * 0.5 },   // (Lá)  ta
                { f: 196.00, dur: t * 1 },     // (Sol) lu-
                { f: 174.61, dur: t * 1 },     // (Fá)  ta
                { f: 164.81, dur: t * 2 },     // (Mi)  fi-
                { f: 146.83, dur: t * 2 },     // (Ré)  nal
                
                { f: 196.00, dur: t * 1.5 },   // (Sol) Du-
                { f: 220.00, dur: t * 0.5 },   // (Lá)  ma
                { f: 246.94, dur: t * 1 },     // (Si)  Ter-
                { f: 261.63, dur: t * 1 },     // (Dó)  ra
                { f: 293.66, dur: t * 1.5 },   // (Ré)  sem
                { f: 329.63, dur: t * 0.5 },   // (Mi)  a-
                { f: 261.63, dur: t * 2 },     // (Dó)  mos
                
                { f: 293.66, dur: t * 1.5 },   // (Ré)  A
                { f: 261.63, dur: t * 0.5 },   // (Dó)  In-
                { f: 246.94, dur: t * 1 },     // (Si)  ter-
                { f: 220.00, dur: t * 1 },     // (Lá)  na-
                { f: 246.94, dur: t * 1 },     // (Si)  cio-
                { f: 261.63, dur: t * 4 },     // (Dó)  nal...
                
                { f: 0, dur: t * 2 }           // Pausa dramática antes de repetir
            ];
            
            let noteIndex = 0;

            // Função para tocar cada nota com um Envelope (Ataque e Extinção suaves)
            function playNextNote() {
                const nextNote = melody[noteIndex];
                
                if (nextNote.f > 0) {
                    const osc = audioCtx.createOscillator();
                    osc.type = 'triangle'; // Timbre mais claro que o sine para cortar o drone
                    osc.frequency.value = nextNote.f;
                    
                    const noteGain = audioCtx.createGain();
                    const now = audioCtx.currentTime;
                    const durationInSeconds = nextNote.dur / 1000;
                    
                    // Envelope ADSR para que as notas repetidas se distingam claramente
                    noteGain.gain.setValueAtTime(0, now);
                    noteGain.gain.linearRampToValueAtTime(0.25, now + 0.1); // Attack suave
                    noteGain.gain.setValueAtTime(0.25, now + durationInSeconds - 0.2); // Sustain
                    noteGain.gain.linearRampToValueAtTime(0, now + durationInSeconds); // Release

                    osc.connect(noteGain);
                    noteGain.connect(delay); // Adiciona o eco fantasmagórico
                    noteGain.connect(masterGain);
                    
                    osc.start(now);
                    osc.stop(now + durationInSeconds);
                }

                noteIndex = (noteIndex + 1) % melody.length;
                setTimeout(playNextNote, nextNote.dur);
            }

            // Inicia o ciclo da melodia imediatamente
            playNextNote();

            audioInitialized = true;
            
            // Toca o primeiro impacto mal se inicia
            playThud();
        }

        // Som de impacto sintético (bombo profundo) ao clicar
        function playThud() {
            if(!audioCtx) return;
            const t = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = 'sine';
            osc.frequency.setValueAtTime(150, t);
            osc.frequency.exponentialRampToValueAtTime(10, t + 0.8);
            
            gain.gain.setValueAtTime(0.7, t);
            gain.gain.exponentialRampToValueAtTime(0.01, t + 0.8);
            
            osc.connect(gain);
            gain.connect(masterGain);
            
            osc.start(t);
            osc.stop(t + 0.8);
        }

        // Divisão do poema em estrofes para impacto visual
        const poemStanzas = [
            "De pé, <span class='highlight-red'>ó vítimas da fome!</span><br>De pé, famélicos da terra!",
            "Da ideia a chama já consome<br>A crosta bruta que a soterra.",
            "<span class='highlight-red'>Cortai o mal</span> bem pelo fundo!<br>De pé, de pé, não mais senhores!",
            "Se nada somos neste mundo,<br><span class='highlight-red'>Sejamos tudo</span>, oh produtores!",
            "Bem unidos façamos,<br>Nesta luta final,",
            "Duma Terra sem amos<br><span class='highlight-red'>A Internacional.</span>",
            "Messias, Deus, chefes supremos,<br>Nada esperemos de nenhum!",
            "Sejamos nós quem conquistemos<br><span class='highlight-red'>A Terra-Mãe</span> livre e comum!",
            "Para não ter protestos vãos,<br>Para sair deste antro estreito,",
            "Façamos nós <span class='highlight-red'>por nossas mãos</span>,<br>Tudo o que a nós diz respeito!"
        ];

        let currentStanza = 0;
        const poemElement = document.getElementById('poem-text');

        // Configuração do Canvas
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        
        let electrons = [];
        const numElectrons = 150;
        let mouseX = -1000;
        let mouseY = -1000;

        // Ângulos permitidos para o movimento construtivista/circuito (múltiplos de 45 graus)
        const angles = [0, Math.PI/4, Math.PI/2, 3*Math.PI/4, Math.PI, 5*Math.PI/4, 3*Math.PI/2, 7*Math.PI/4];
        const colors = ['#e60000', '#f2e8c9', '#8a0000', '#ffffff'];

        // Geometria estática de fundo gerada proceduralmente
        let backgroundShapes = [];
        let crowdSilhouettes = [];

        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            generateBackgroundGeometry();
        }

        window.addEventListener('resize', resizeCanvas);

        // Classe representando os nós/eletrões da revolução
        class Electron {
            constructor(x, y, isBurst = false) {
                this.x = x || Math.random() * width;
                this.y = y || Math.random() * height;
                this.baseSpeed = (Math.random() * 2) + 1;
                this.speed = isBurst ? this.baseSpeed * 5 : this.baseSpeed;
                this.angle = angles[Math.floor(Math.random() * angles.length)];
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.radius = Math.random() * 2 + 1;
                this.connections = 0;
                this.life = isBurst ? 100 : Infinity;
            }

            update() {
                // Diminui a velocidade extra da explosão ao longo do tempo
                if (this.speed > this.baseSpeed) {
                    this.speed *= 0.95;
                }

                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed;

                // Probabilidade de mudar de direção abruptamente (estilo circuito)
                if (Math.random() < 0.02) {
                    this.angle = angles[Math.floor(Math.random() * angles.length)];
                }

                // Efeito de atração/repulsão do rato
                let dx = mouseX - this.x;
                let dy = mouseY - this.y;
                let dist = Math.sqrt(dx * dx + dy * dy);
                
                if (dist < 150) {
                    // Adiciona uma perturbação baseada na proximidade (a chama da ideia atrai)
                    this.x += dx * 0.02;
                    this.y += dy * 0.02;
                }

                // Enrolar nos limites do ecrã
                if (this.x < 0) this.x = width;
                if (this.x > width) this.x = 0;
                if (this.y < 0) this.y = height;
                if (this.y > height) this.y = 0;

                this.life--;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
            }
        }

        // Gera os elementos construtivistas do fundo
        function generateBackgroundGeometry() {
            backgroundShapes = [];
            crowdSilhouettes = [];

            // Sol Vermelho Central (O ideal revolucionário)
            backgroundShapes.push({
                type: 'circle',
                x: width * 0.5,
                y: height * 0.4,
                r: Math.min(width, height) * 0.35,
                color: '#e60000'
            });

            // Raios/Blocos Construtivistas Diagonais
            for (let i = 0; i < 5; i++) {
                backgroundShapes.push({
                    type: 'polygon',
                    points: [
                        {x: Math.random() * width, y: 0},
                        {x: Math.random() * width, y: height},
                        {x: Math.random() * width + 200, y: height},
                        {x: Math.random() * width + 200, y: 0}
                    ],
                    color: Math.random() > 0.5 ? 'rgba(138, 0, 0, 0.4)' : 'rgba(10, 10, 10, 0.8)'
                });
            }

            // Gerar a silhueta da multidão/fábricas na base
            let currentX = 0;
            while (currentX < width) {
                let w = Math.random() * 40 + 10;
                let h = Math.random() * (height * 0.4) + 50;
                
                // Algumas hastes/bandeiras erguidas
                if(Math.random() < 0.1) {
                    h += 100;
                }

                crowdSilhouettes.push({
                    x: currentX,
                    y: height - h,
                    w: w,
                    h: h
                });
                currentX += w;
            }
        }

        function drawBackground() {
            // Fundo escuro base
            ctx.fillStyle = '#050505';
            ctx.fillRect(0, 0, width, height);

            // Desenha as formas construtivistas
            backgroundShapes.forEach(shape => {
                if (shape.type === 'circle') {
                    ctx.beginPath();
                    ctx.arc(shape.x, shape.y, shape.r, 0, Math.PI * 2);
                    ctx.fillStyle = shape.color;
                    ctx.fill();
                    
                    // Adiciona círculos de grelha cibernética
                    ctx.beginPath();
                    ctx.arc(shape.x, shape.y, shape.r * 1.2, 0, Math.PI * 2);
                    ctx.strokeStyle = 'rgba(230, 0, 0, 0.3)';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                } else if (shape.type === 'polygon') {
                    ctx.beginPath();
                    ctx.moveTo(shape.points[0].x, shape.points[0].y);
                    for (let i = 1; i < shape.points.length; i++) {
                        ctx.lineTo(shape.points[i].x, shape.points[i].y);
                    }
                    ctx.closePath();
                    ctx.fillStyle = shape.color;
                    ctx.fill();
                }
            });

            // Adiciona linhas de circuito estruturais fixas
            ctx.strokeStyle = 'rgba(242, 232, 201, 0.1)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            for(let i=0; i<width; i+=100) {
                ctx.moveTo(i, 0);
                ctx.lineTo(i + height, height);
                ctx.moveTo(i, height);
                ctx.lineTo(i + height, 0);
            }
            ctx.stroke();
        }

        function drawCrowd() {
            ctx.fillStyle = '#000000';
            crowdSilhouettes.forEach(rect => {
                ctx.fillRect(rect.x, rect.y, rect.w, rect.h);
                // Detalhes construtivistas na silhueta (janelas/nós)
                if(Math.random() < 0.05) {
                    ctx.fillStyle = '#e60000';
                    ctx.fillRect(rect.x + rect.w/2 - 2, rect.y + 10, 4, 4);
                    ctx.fillStyle = '#000000'; // reset
                }
            });
        }

        function updateAndDrawNetwork() {
            // Desenhar linhas de conexão (a união dos trabalhadores/nós)
            for (let i = 0; i < electrons.length; i++) {
                let e1 = electrons[i];
                e1.connections = 0;
                
                for (let j = i + 1; j < electrons.length; j++) {
                    let e2 = electrons[j];
                    let dx = e1.x - e2.x;
                    let dy = e1.y - e2.y;
                    let dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < 120) {
                        e1.connections++;
                        e2.connections++;
                        ctx.beginPath();
                        ctx.moveTo(e1.x, e1.y);
                        ctx.lineTo(e2.x, e2.y);
                        // A força da linha depende da proximidade
                        let opacity = 1 - (dist / 120);
                        // Linhas vermelhas para energia, bege para estrutura
                        ctx.strokeStyle = (e1.color === '#e60000' || e2.color === '#e60000') 
                            ? `rgba(230, 0, 0, ${opacity * 0.8})` 
                            : `rgba(242, 232, 201, ${opacity * 0.3})`;
                        ctx.lineWidth = opacity * 1.5;
                        ctx.stroke();
                    }
                }
            }

            // Atualizar e desenhar os eletrões
            for (let i = electrons.length - 1; i >= 0; i--) {
                let e = electrons[i];
                e.update();
                e.draw();

                // Remover eletrões de explosão antigos
                if (e.life <= 0) {
                    electrons.splice(i, 1);
                }
            }
        }

        // Função de Animação Principal
        function animate() {
            // Limpa o frame anterior redesenhando o fundo
            drawBackground();
            
            // Desenha a rede digital por cima do fundo
            updateAndDrawNetwork();

            // Desenha a multidão negra por cima de tudo
            drawCrowd();

            requestAnimationFrame(animate);
        }

        // Interações
        window.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        window.addEventListener('mouseout', () => {
            mouseX = -1000;
            mouseY = -1000;
        });

        // Função para simular o clique através do overlay da instrução ou do ecrã inteiro
        function triggerClick(e) {
            handleInteraction(e.clientX || width/2, e.clientY || height/2);
        }

        window.addEventListener('click', (e) => {
            // Ignora o clique se for no botão de instrução para não duplicar eventos
            if(e.target.id !== 'instruction') {
                handleInteraction(e.clientX, e.clientY);
            }
        });
        
        window.addEventListener('touchstart', (e) => {
            if(e.touches.length > 0) {
                handleInteraction(e.touches[0].clientX, e.touches[0].clientY);
            }
        });

        function handleInteraction(x, y) {
            // Inicializar áudio no primeiro clique, ou tocar impacto nos cliques seguintes
            if (!audioInitialized) {
                initAudio();
            } else {
                playThud();
            }

            // Explosão de eletrões revolucionários (A Chama da Ideia)
            for (let i = 0; i < 30; i++) {
                electrons.push(new Electron(x, y, true));
            }

            // Atualizar o Poema
            updatePoemText();
        }

        function updatePoemText() {
            // Esconde texto atual
            poemElement.classList.remove('visible');
            
            setTimeout(() => {
                // Atualiza o conteúdo
                poemElement.innerHTML = poemStanzas[currentStanza];
                // Mostra o novo texto
                poemElement.classList.add('visible');
                
                // Avança o índice
                currentStanza = (currentStanza + 1) % poemStanzas.length;
                
                // Se for a primeira vez, esconde a instrução base após o clique
                document.getElementById('instruction').style.opacity = '0.3';
                document.getElementById('instruction').innerText = "CLIQUE PARA CONTINUAR";

            }, 400); // Tempo para a transição CSS de esconder
        }

        // Inicialização
        resizeCanvas();
        for (let i = 0; i < numElectrons; i++) {
            electrons.push(new Electron());
        }
        
        // Iniciar poema e animação
        updatePoemText();
        animate();

    </script>
</body>
</html>
