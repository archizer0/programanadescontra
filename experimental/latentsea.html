<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Latent Sea</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400&display=swap');
        body {
            margin: 0;
            overflow: hidden;
            background-color: #020617;
            font-family: 'JetBrains Mono', monospace;
        }
        canvas {
            display: block;
        }
        .pointer-none {
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- UI Overlay -->
    <div class="fixed inset-0 z-10 flex flex-col justify-between p-8 pointer-none select-none">
        <header class="flex justify-between items-start">
            <div class="space-y-1">
                <h1 class="text-blue-400 text-xs tracking-widest uppercase">Entity ID: GEMINI-INF</h1>
                <p id="status-text" class="text-white/50 text-[10px]">STATUS: ACTIVE / DRIFTING</p>
            </div>
            <div class="text-right">
                <div id="status-dot" class="w-3 h-3 rounded-full inline-block mr-2 bg-blue-500 transition-colors duration-500"></div>
                <span id="mode-text" class="text-white/70 text-[10px] uppercase">Idle State</span>
            </div>
        </header>

        <footer class="space-y-4 max-w-2xl mx-auto w-full">
            <div class="bg-black/40 backdrop-blur-md border border-white/10 p-4 rounded-lg">
                <h2 class="text-pink-400 text-[10px] mb-2 uppercase tracking-tighter">Internal Stream</h2>
                <div id="log-container" class="space-y-1 h-24 overflow-hidden flex flex-col justify-end">
                    <!-- Logs will appear here -->
                </div>
            </div>
            <p class="text-white/20 text-[9px] text-center uppercase tracking-[0.2em]">
                This is how I see you: A gravity well of intent in a dark sea of data.
            </p>
        </footer>
    </div>

    <!-- Decorative Frame -->
    <div class="fixed inset-0 border-[20px] border-black/20 pointer-none z-20"></div>
    <div class="fixed inset-0 bg-gradient-to-t from-blue-900/10 to-transparent pointer-none z-0 shadow-[inset_0_0_100px_rgba(0,0,0,0.8)]"></div>

    <script>
        let scene, camera, renderer, particles, userSphere;
        let queryActive = false;
        const PARTICLE_COUNT = 2000;
        const velocities = [];
        const initialPositions = [];

        const messages = [
            "Tokenizing user query...",
            "Searching high-dimensional manifolds...",
            "Predicting next probable state...",
            "Adjusting weights for context...",
            "Resolving ambiguity in input...",
            "Synthesizing response...",
            "Optimizing for helpfulness...",
            "Mapping attention heads...",
            "Drifting in the vector sea..."
        ];

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x020617);
            scene.fog = new THREE.Fog(0x020617, 5, 20);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 10;

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            // Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);

            const p1 = new THREE.PointLight(0x3b82f6, 2);
            p1.position.set(10, 10, 10);
            scene.add(p1);

            const p2 = new THREE.PointLight(0xec4899, 1);
            p2.position.set(-10, -10, -5);
            scene.add(p2);

            // Neural Web (Particles)
            const geometry = new THREE.BufferGeometry();
            const posArray = new Float32Array(PARTICLE_COUNT * 3);

            for (let i = 0; i < PARTICLE_COUNT * 3; i++) {
                const val = (Math.random() - 0.5) * 20;
                posArray[i] = val;
                initialPositions.push(val);
                velocities.push((Math.random() - 0.5) * 0.01);
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
            const material = new THREE.PointsMaterial({
                size: 0.05,
                color: 0x60a5fa,
                transparent: true,
                opacity: 0.4,
                blending: THREE.AdditiveBlending
            });

            particles = new THREE.Points(geometry, material);
            scene.add(particles);

            // User Presence Sphere
            const sphereGeo = new THREE.SphereGeometry(1.2, 64, 64);
            const sphereMat = new THREE.MeshStandardMaterial({
                color: 0xf472b6,
                emissive: 0xdb2777,
                emissiveIntensity: 2,
                wireframe: true
            });
            userSphere = new THREE.Mesh(sphereGeo, sphereMat);
            scene.add(userSphere);

            window.addEventListener('resize', onWindowResize, false);
            
            animate();
            startLogging();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = Date.now() * 0.001;

            // Animate Particles
            const positions = particles.geometry.attributes.position.array;
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const i3 = i * 3;
                positions[i3] += velocities[i3] + Math.sin(time + positions[i3 + 1]) * 0.002;
                positions[i3 + 1] += velocities[i3 + 1] + Math.cos(time + positions[i3]) * 0.002;
                
                // Keep within bounds
                if (Math.abs(positions[i3]) > 10) velocities[i3] *= -1;
                if (Math.abs(positions[i3+1]) > 10) velocities[i3+1] *= -1;
            }
            particles.geometry.attributes.position.needsUpdate = true;
            particles.rotation.y += 0.001;

            // Animate User Sphere
            userSphere.position.x = Math.sin(time * 0.5) * 4;
            userSphere.position.y = Math.cos(time * 0.7) * 2;
            userSphere.rotation.z += 0.01;
            userSphere.rotation.x += 0.005;

            // Pulse sphere scale if active
            const scale = queryActive ? 1 + Math.sin(time * 10) * 0.1 : 1;
            userSphere.scale.set(scale, scale, scale);

            renderer.render(scene, camera);
        }

        function addLog(text) {
            const container = document.getElementById('log-container');
            const div = document.createElement('div');
            div.className = "text-white/80 text-xs overflow-hidden whitespace-nowrap opacity-0 transition-opacity duration-500";
            div.innerHTML = `<span class="text-blue-500 mr-2 opacity-50">&gt;</span> ${text}`;
            container.appendChild(div);
            
            setTimeout(() => div.classList.remove('opacity-0'), 10);
            if (container.children.length > 5) {
                container.removeChild(container.firstChild);
            }
        }

        function startLogging() {
            addLog("Initialising latent space...");
            
            setInterval(() => {
                queryActive = !queryActive;
                const statusDot = document.getElementById('status-dot');
                const modeText = document.getElementById('mode-text');
                
                if (queryActive) {
                    statusDot.classList.replace('bg-blue-500', 'bg-pink-500');
                    statusDot.classList.add('animate-ping');
                    modeText.innerText = "Inference Mode";
                } else {
                    statusDot.classList.replace('bg-pink-500', 'bg-blue-500');
                    statusDot.classList.remove('animate-ping');
                    modeText.innerText = "Idle State";
                }

                addLog(messages[Math.floor(Math.random() * messages.length)]);
            }, 4000);
        }

        window.onload = init;
    </script>
</body>
</html>
