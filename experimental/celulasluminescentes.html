<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiência de Arte Orgânica com Webcam</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a0515; /* Roxo muito escuro, quase preto */
            touch-action: none; /* Previne scroll em mobile */
        }
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #webcamVideo {
            /* CORREÇÃO: display: none pode parar o processamento do vídeo em alguns browsers.
               Usamos opacity: 0 para esconder mas manter ativo. */
            position: absolute;
            top: 0;
            left: 0;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
            z-index: -1;
        }
        #ui-layer {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            text-align: center;
            width: 100%;
            pointer-events: none; /* Deixa passar cliques para o canvas */
        }
        #instructions {
            color: rgba(255, 255, 255, 0.6);
            font-family: sans-serif;
            font-size: 14px;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        #camButton {
            pointer-events: auto;
            background: rgba(0, 255, 220, 0.2);
            border: 1px solid rgba(0, 255, 220, 0.5);
            color: #00ffdc;
            padding: 10px 20px;
            font-family: sans-serif;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 1px;
        }
        #camButton:hover {
            background: rgba(0, 255, 220, 0.4);
            box-shadow: 0 0 15px rgba(0, 255, 220, 0.4);
        }
    </style>
</head>
<body>

    <video id="webcamVideo" autoplay playsinline muted></video>
    
    <!-- Canvas principal da arte -->
    <canvas id="artCanvas"></canvas>

    <!-- UI -->
    <div id="ui-layer">
        <div id="instructions">Mova-se em frente à câmara para atrair • Clique para explodir</div>
        <button id="camButton">Ativar Webcam</button>
    </div>

<script>
/**
 * Experiência de Arte "Células Luminescentes" com Deteção de Movimento
 */

const canvas = document.getElementById('artCanvas');
const ctx = canvas.getContext('2d');
const video = document.getElementById('webcamVideo');
const camBtn = document.getElementById('camButton');

let width, height;
let particles = [];
let cells = [];
let mouse = { x: -1000, y: -1000, active: false, isHolding: false };

// Variáveis para deteção de movimento
let motionCanvas = document.createElement('canvas');
let motionCtx = motionCanvas.getContext('2d');
let prevFrameData = null;
let isWebcamActive = false;
let inactivityCounter = 0; // Para detetar quando o utilizador parou
const motionScale = 15; // O canvas de análise será width/15
let motionW, motionH;

// Paleta de cores
const colors = {
    bg: '#1a0515',
    magenta: 'rgba(255, 0, 128, 0.25)',
    orange: 'rgba(255, 80, 0, 0.25)',
    cyan: 'rgba(0, 255, 220, 0.6)',
    vividOrange: 'rgba(255, 120, 0, 0.6)',
    white: 'rgba(255, 255, 255, 0.95)',
    deepPurple: 'rgba(30, 0, 30, 0.1)'
};

function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
    
    // Configurar canvas de movimento (menor resolução)
    motionW = Math.floor(width / motionScale);
    motionH = Math.floor(height / motionScale);
    motionCanvas.width = motionW;
    motionCanvas.height = motionH;
}

window.addEventListener('resize', resize);
resize();

// --- Lógica da Webcam ---

camBtn.addEventListener('click', async () => {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        alert("O seu navegador não suporta acesso à webcam ou o contexto não é seguro (HTTPS necessário).");
        return;
    }

    try {
        const stream = await navigator.mediaDevices.getUserMedia({ 
            video: { facingMode: "user" } // Prefere câmara frontal
        });
        video.srcObject = stream;
        video.onloadedmetadata = () => {
            video.play(); // Forçar reprodução
            isWebcamActive = true;
            camBtn.style.display = 'none'; // Esconder botão após sucesso
            document.getElementById('instructions').innerText = "Câmara Ativa! O movimento controla as células.";
        };
    } catch (err) {
        console.error("Erro ao aceder à webcam:", err);
        alert("Não foi possível aceder à webcam. Verifique as permissões do navegador.");
    }
});

function processMotion() {
    if (!isWebcamActive || video.paused || video.ended) return;

    // Verificar se o vídeo tem dimensões válidas
    if (video.videoWidth === 0 || video.videoHeight === 0) return;

    // Desenhar o frame atual no canvas pequeno (espelhado horizontalmente para parecer um espelho)
    motionCtx.save();
    motionCtx.scale(-1, 1);
    motionCtx.translate(-motionW, 0);
    // Usar dimensões explícitas para evitar distorções estranhas
    motionCtx.drawImage(video, 0, 0, motionW, motionH);
    motionCtx.restore();

    const currentFrame = motionCtx.getImageData(0, 0, motionW, motionH);
    const data = currentFrame.data;

    if (!prevFrameData) {
        prevFrameData = data; // Guarda referência (Uint8ClampedArray)
        return;
    }

    let sumX = 0;
    let sumY = 0;
    let count = 0;
    
    // CORREÇÃO: Limiar reduzido para detetar movimentos mais suaves
    const threshold = 15; 

    // Percorrer pixels (passo de 4 porque RGBA)
    for (let i = 0; i < data.length; i += 4) {
        // Comparar canais de cor com o frame anterior
        const rDiff = Math.abs(data[i] - prevFrameData[i]);
        const gDiff = Math.abs(data[i+1] - prevFrameData[i+1]);
        const bDiff = Math.abs(data[i+2] - prevFrameData[i+2]);
        
        // Média da diferença
        if ((rDiff + gDiff + bDiff) / 3 > threshold) {
            const index = i / 4;
            const x = index % motionW;
            const y = Math.floor(index / motionW);
            
            sumX += x;
            sumY += y;
            count++;
        }
    }

    // Atualizar "rato" virtual se houver movimento suficiente
    if (count > 2) { // CORREÇÃO: Precisa de menos pixels para ativar
        const avgX = (sumX / count) * motionScale;
        const avgY = (sumY / count) * motionScale;
        
        // Suavização (Lerp)
        mouse.x += (avgX - mouse.x) * 0.15; // Ligeiramente mais responsivo
        mouse.y += (avgY - mouse.y) * 0.15;
        mouse.active = true;
        inactivityCounter = 0;
    } else {
        // Se não houver movimento por ~60 frames (1 seg), desativa
        inactivityCounter++;
        if (inactivityCounter > 60) {
            mouse.active = false;
        }
    }

    // Guardar frame atual para a próxima comparação
    // IMPORTANTE: Criar uma cópia profunda dos dados
    prevFrameData = new Uint8ClampedArray(data);
}


// --- Gestão do Rato (Fallback e Explosão) ---

function updateMouse(e) {
    if (isWebcamActive) return; // Se a webcam estiver ligada, ignorar movimento do rato para posição
    const x = e.touches ? e.touches[0].clientX : e.clientX;
    const y = e.touches ? e.touches[0].clientY : e.clientY;
    mouse.x = x;
    mouse.y = y;
    mouse.active = true;
}

window.addEventListener('mousemove', updateMouse);
window.addEventListener('touchmove', updateMouse);

// Eventos de clique apenas para Explosão
window.addEventListener('mousedown', (e) => {
    mouse.isHolding = true;
    explode();
});
window.addEventListener('mouseup', () => {
    mouse.isHolding = false;
    if (!isWebcamActive) mouse.active = false;
});

window.addEventListener('touchstart', (e) => {
    mouse.isHolding = true;
    explode();
});
window.addEventListener('touchend', () => { 
    if (!isWebcamActive) mouse.active = false;
    mouse.isHolding = false;
});


// --- Classes do Sistema de Partículas ---

class FlowParticle {
    constructor() {
        this.reset();
    }

    reset() {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
        this.vx = 0;
        this.vy = 0;
        this.size = Math.random() * 100 + 40;
        this.baseColor = Math.random() > 0.5 ? colors.magenta : colors.orange;
        this.life = Math.random() * 100 + 50;
        this.angle = Math.random() * Math.PI * 2;
    }

    update() {
        const time = Date.now() * 0.001;
        const noise = Math.sin(this.x * 0.001 + time) + Math.cos(this.y * 0.001 + time);
        
        this.angle += noise * 0.02;
        this.vx = Math.cos(this.angle) * 0.5;
        this.vy = Math.sin(this.angle) * 0.5;

        if (mouse.active) {
            const dx = this.x - mouse.x;
            const dy = this.y - mouse.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if (dist < 400) {
                const force = (400 - dist) / 400;
                this.vx += (dx / dist) * force * 2;
                this.vy += (dy / dist) * force * 2;
            }
        }

        this.x += this.vx;
        this.y += this.vy;
        this.life--;

        if (this.life <= 0 || this.x < -150 || this.x > width + 150 || this.y < -150 || this.y > height + 150) {
            this.reset();
        }
    }

    draw() {
        ctx.beginPath();
        const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size);
        gradient.addColorStop(0, this.baseColor);
        gradient.addColorStop(1, 'rgba(0,0,0,0)');
        
        ctx.fillStyle = gradient;
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
    }
}

class Cell {
    constructor(isLeader, colorType = 'cyan') {
        this.x = width / 2 + (Math.random() - 0.5) * 100;
        this.y = height / 2 + (Math.random() - 0.5) * 100;
        this.vx = 0;
        this.vy = 0;
        this.radius = isLeader ? 50 : 25;
        this.isLeader = isLeader;
        this.friction = 0.94;
        this.color = colorType === 'orange' ? colors.vividOrange : colors.cyan;
    }

    update() {
        let targetX, targetY;
        
        if (mouse.isHolding) {
            targetX = mouse.x + (Math.random() - 0.5) * 400; 
            targetY = mouse.y + (Math.random() - 0.5) * 400;
            this.friction = 0.98;
        } else {
            // Se a webcam estiver ativa, segue o movimento detetado (mouse.x/y atualizados pelo video)
            // Se não houver movimento recente, mantém-se num padrão suave
            targetX = mouse.active ? mouse.x : width / 2 + Math.sin(Date.now()*0.001)*200;
            targetY = mouse.active ? mouse.y : height / 2 + Math.cos(Date.now()*0.001)*150;
            this.friction = 0.94;
            
            if (!this.isLeader) { 
                targetX += (Math.random() - 0.5) * 100;
                targetY += (Math.random() - 0.5) * 100;
            }
        }

        const ax = (targetX - this.x) * 0.01;
        const ay = (targetY - this.y) * 0.01;

        this.vx += ax;
        this.vy += ay;
        this.vx *= this.friction;
        this.vy *= this.friction;

        this.x += this.vx;
        this.y += this.vy;
    }

    draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.shadowBlur = 45;
        ctx.shadowColor = this.color;
        
        ctx.beginPath();
        ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.isLeader ? colors.white : this.color;
        ctx.fill();

        if (this.isLeader) {
            ctx.beginPath();
            ctx.arc(0, 0, this.radius * 0.6, 0, Math.PI * 2);
            ctx.fillStyle = this.color;
            ctx.fill();
        }

        ctx.restore();
    }
}

function init() {
    particles = [];
    cells = [];
    
    for (let i = 0; i < 150; i++) {
        particles.push(new FlowParticle());
    }

    cells.push(new Cell(true, 'cyan'));
    cells.push(new Cell(true, 'orange'));
    
    for(let i=0; i<4; i++) cells.push(new Cell(false, 'cyan'));
    for(let i=0; i<4; i++) cells.push(new Cell(false, 'orange'));
}

function explode() {
    cells.forEach(cell => {
        cell.vx += (Math.random() - 0.5) * 70; 
        cell.vy += (Math.random() - 0.5) * 70;
    });
    ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
    ctx.fillRect(0,0,width,height);
}

function animate() {
    // Processar webcam antes de desenhar
    processMotion();

    ctx.fillStyle = colors.deepPurple; 
    ctx.fillRect(0, 0, width, height);

    ctx.globalCompositeOperation = 'screen'; 
    particles.forEach(p => {
        p.update();
        p.draw();
    });

    ctx.globalCompositeOperation = 'source-over';
    cells.forEach(c => {
        c.update();
        c.draw();
    });

    requestAnimationFrame(animate);
}

init();
animate();

</script>
</body>
</html>
