<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Baroque: Bioluminescent Ecosystem</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #010206;
            cursor: crosshair;
        }
        canvas {
            display: block;
        }
        #ui-overlay {
            position: absolute;
            top: 30px;
            left: 30px;
            pointer-events: none;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            color: rgba(255, 255, 255, 0.4);
            z-index: 10;
        }
        .status-tag {
            transition: all 0.5s ease;
        }
    </style>
</head>
<body>
    <div id="ui-overlay">
        <h1 class="text-2xl font-thin tracking-[0.3em] uppercase">Rhizomatic Neuralis</h1>
        <p class="text-[10px] tracking-[0.5em] opacity-40 mt-2">DEEP NETWORK ECOSYSTEM • v2.1</p>
        <div class="mt-4 flex items-center gap-2">
            <span class="text-[9px] uppercase tracking-widest opacity-60">Neural State:</span>
            <span id="polarity-status" class="status-tag text-[9px] uppercase tracking-widest text-blue-400 font-bold">Neutral</span>
        </div>
        <p class="text-[8px] opacity-30 mt-1 uppercase italic">Click to toggle attraction / repulsion</p>
    </div>
    <canvas id="canvas"></canvas>

    <script>
        /**
         * COMPLEX BIOLUMINESCENT RHIZOMATIC ECOSYSTEM
         * v2.1: Added Dynamic Polarity (Attraction/Repulsion)
         */

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let cells = [];
        let pulses = [];
        
        const CELL_COUNT = 350; 
        const CONNECTION_DISTANCE = 140;
        const MOUSE_INFLUENCE = 250;

        let mouse = { x: -2000, y: -2000, active: false };
        // Polarity: 1 for repulsion, -1 for attraction
        let mousePolarity = 1; 

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initCells();
        }

        const colors = {
            bg: '#010206',
            cellWhite: 'rgba(255, 255, 255, 0.95)',
            cellPink: 'rgba(255, 150, 210, 0.95)',
            pulseBlue: 'rgba(0, 150, 255, 0.9)',
            networkBlue: 'rgba(40, 70, 180, 0.12)'
        };

        class Cell {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.layer = Math.floor(Math.random() * 3);
                const speedMult = (this.layer + 1) * 0.2;
                this.vx = (Math.random() - 0.5) * speedMult;
                this.vy = (Math.random() - 0.5) * speedMult;
                this.radius = (this.layer + 1) * 0.8 + Math.random();
                this.type = Math.random() > 0.4 ? 'white' : 'pink';
                this.phase = Math.random() * Math.PI * 2;
                this.pulseSpeed = 0.01 + Math.random() * 0.02;
                this.connections = [];
                this.lastPulseTime = 0;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                if (mouse.active) {
                    const dx = this.x - mouse.x;
                    const dy = this.y - mouse.y;
                    const distSq = dx * dx + dy * dy;
                    const influenceRange = MOUSE_INFLUENCE * (this.layer + 1) * 0.5;
                    
                    if (distSq < influenceRange * influenceRange) {
                        const dist = Math.sqrt(distSq);
                        // Strength fades with distance
                        const force = (influenceRange - dist) / influenceRange;
                        
                        // mousePolarity: 1 (Push away), -1 (Pull in)
                        const directionalForce = force * 0.22 * mousePolarity;
                        
                        this.vx += (dx / dist) * directionalForce;
                        this.vy += (dy / dist) * directionalForce;
                        
                        // Trigger extra sparks when interacted with
                        if (Math.random() < 0.01) this.spark();
                    }
                }

                this.vx *= 0.98;
                this.vy *= 0.98;

                if (this.x < -50) this.x = width + 50;
                if (this.x > width + 50) this.x = -50;
                if (this.y < -50) this.y = height + 50;
                if (this.y > height + 50) this.y = -50;

                this.phase += this.pulseSpeed;
                
                if (Math.random() < 0.0004 && Date.now() - this.lastPulseTime > 3000) {
                    this.spark();
                }
            }

            spark() {
                this.lastPulseTime = Date.now();
                const targets = this.connections.sort(() => 0.5 - Math.random()).slice(0, 2);
                targets.forEach(t => pulses.push(new SignalPulse(this, t)));
            }

            draw() {
                const intensity = 0.4 + Math.sin(this.phase) * 0.6;
                const r = this.radius * (0.9 + intensity * 0.3);
                
                ctx.beginPath();
                ctx.arc(this.x, this.y, r, 0, Math.PI * 2);
                ctx.fillStyle = this.type === 'white' ? colors.cellWhite : colors.cellPink;
                
                ctx.shadowBlur = (this.layer + 1) * 5 * intensity;
                ctx.shadowColor = ctx.fillStyle;
                ctx.fill();
                ctx.shadowBlur = 0;

                if (this.layer > 0) {
                    const aura = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, r * 5);
                    aura.addColorStop(0, this.type === 'white' ? `rgba(255,255,255,${0.15 * intensity})` : `rgba(255,100,200,${0.15 * intensity})`);
                    aura.addColorStop(1, 'transparent');
                    ctx.fillStyle = aura;
                    ctx.fill();
                }
            }
        }

        class SignalPulse {
            constructor(start, end) {
                this.start = start;
                this.end = end;
                this.progress = 0;
                this.speed = 0.008 + Math.random() * 0.015;
            }

            update() {
                this.progress += this.speed;
                return this.progress >= 1;
            }

            draw() {
                const px = this.start.x + (this.end.x - this.start.x) * this.progress;
                const py = this.start.y + (this.end.y - this.start.y) * this.progress;
                
                ctx.beginPath();
                ctx.arc(px, py, 2, 0, Math.PI * 2);
                ctx.fillStyle = colors.pulseBlue;
                ctx.shadowBlur = 12;
                ctx.shadowColor = colors.pulseBlue;
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        function initCells() {
            cells = [];
            for (let i = 0; i < CELL_COUNT; i++) {
                cells.push(new Cell());
            }
        }

        function togglePolarity() {
            // Pick a new random polarity
            mousePolarity = Math.random() > 0.5 ? 1 : -1;
            const statusEl = document.getElementById('polarity-status');
            
            if (mousePolarity === 1) {
                statusEl.innerText = "Repulsion";
                statusEl.className = "status-tag text-[9px] uppercase tracking-widest text-pink-400 font-bold";
            } else {
                statusEl.innerText = "Attraction";
                statusEl.className = "status-tag text-[9px] uppercase tracking-widest text-blue-400 font-bold";
            }
        }

        function drawPathways() {
            for (let l = 0; l < 3; l++) {
                ctx.lineWidth = 0.3 + (l * 0.4);
                const layerCells = cells.filter(c => c.layer === l);
                
                layerCells.forEach((a, i) => {
                    a.connections = [];
                    for (let j = i + 1; j < layerCells.length; j++) {
                        const b = layerCells[j];
                        const dx = a.x - b.x;
                        const dy = a.y - b.y;
                        const distSq = dx * dx + dy * dy;
                        const maxDist = CONNECTION_DISTANCE * (l + 1) * 0.6;

                        if (distSq < maxDist * maxDist) {
                            a.connections.push(b);
                            const dist = Math.sqrt(distSq);
                            const alpha = (1 - dist / maxDist) * (0.1 + l * 0.1);
                            
                            ctx.beginPath();
                            ctx.moveTo(a.x, a.y);
                            const ctrlX = (a.x + b.x) / 2 + Math.cos(a.phase + i) * 15;
                            const ctrlY = (a.y + b.y) / 2 + Math.sin(b.phase + j) * 15;
                            ctx.quadraticCurveTo(ctrlX, ctrlY, b.x, b.y);
                            ctx.strokeStyle = `rgba(60, 100, 240, ${alpha})`;
                            ctx.stroke();
                        }
                    }
                });
            }
        }

        function animate() {
            ctx.fillStyle = colors.bg;
            ctx.fillRect(0, 0, width, height);

            drawPathways();

            ctx.globalCompositeOperation = 'lighter';
            for (let i = pulses.length - 1; i >= 0; i--) {
                const done = pulses[i].update();
                pulses[i].draw();
                if (done) pulses.splice(i, 1);
            }
            ctx.globalCompositeOperation = 'source-over';

            cells.forEach(cell => {
                cell.update();
                cell.draw();
            });

            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', resize);
        
        const updateMouse = (x, y, active) => {
            mouse.x = x;
            mouse.y = y;
            mouse.active = active;
        };

        window.addEventListener('mousemove', e => updateMouse(e.clientX, e.clientY, true));
        window.addEventListener('mousedown', (e) => {
            mouse.active = true;
            togglePolarity();
        });
        window.addEventListener('mouseleave', () => mouse.active = false);

        window.addEventListener('touchstart', e => {
            updateMouse(e.touches[0].clientX, e.touches[0].clientY, true);
            togglePolarity();
        }, {passive: false});

        window.addEventListener('touchmove', e => {
            updateMouse(e.touches[0].clientX, e.touches[0].clientY, true);
        }, {passive: false});

        window.addEventListener('touchend', () => mouse.active = false);

        resize();
        animate();
        togglePolarity(); // Initial state

    </script>
</body>
</html>
