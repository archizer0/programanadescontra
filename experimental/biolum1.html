<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Baroque: Bioluminescent Ecosystem</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #010206;
            cursor: crosshair;
        }
        canvas {
            display: block;
        }
        #ui-overlay {
            position: absolute;
            top: 30px;
            left: 30px;
            pointer-events: none;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            color: rgba(255, 255, 255, 0.4);
            z-index: 10;
        }
        .status-tag {
            transition: all 0.5s ease;
        }
    </style>
</head>
<body>
    <div id="ui-overlay">
        <h1 class="text-2xl font-thin tracking-[0.3em] uppercase">Rhizomatic Neuralis</h1>
        <p class="text-[10px] tracking-[0.5em] opacity-40 mt-2">OPTIMIZED NETWORK ECOSYSTEM • v2.3</p>
        <div class="mt-4 flex items-center gap-2">
            <span class="text-[9px] uppercase tracking-widest opacity-60">Neural State:</span>
            <span id="polarity-status" class="status-tag text-[9px] uppercase tracking-widest text-blue-400 font-bold">Neutral</span>
        </div>
        <p class="text-[8px] opacity-30 mt-1 uppercase italic">Click to toggle attraction / repulsion</p>
    </div>
    <canvas id="canvas"></canvas>

    <script>
        /**
         * COMPLEX BIOLUMINESCENT RHIZOMATIC ECOSYSTEM
         * v2.3: Reduced cell count (525) with compensated tendril density
         */

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let cells = [];
        let pulses = [];
        
        // 525 is 25% less than 700
        const CELL_COUNT = 525; 
        // Increased distance and influence to maintain density with fewer nodes
        const CONNECTION_DISTANCE = 190; 
        const MOUSE_INFLUENCE = 300;

        let mouse = { x: -2000, y: -2000, active: false };
        let mousePolarity = 1; 

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initCells();
        }

        const colors = {
            bg: '#010206',
            cellWhite: 'rgba(255, 255, 255, 0.95)',
            cellPink: 'rgba(255, 150, 210, 0.95)',
            pulseBlue: 'rgba(0, 180, 255, 0.95)',
            networkBlue: 'rgba(60, 110, 255, 0.18)'
        };

        class Cell {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.layer = Math.floor(Math.random() * 3);
                const speedMult = (this.layer + 1) * 0.15;
                this.vx = (Math.random() - 0.5) * speedMult;
                this.vy = (Math.random() - 0.5) * speedMult;
                this.radius = (this.layer + 1) * 0.7 + Math.random() * 0.6;
                this.type = Math.random() > 0.4 ? 'white' : 'pink';
                this.phase = Math.random() * Math.PI * 2;
                this.pulseSpeed = 0.007 + Math.random() * 0.012;
                this.connections = [];
                this.lastPulseTime = 0;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                if (mouse.active) {
                    const dx = this.x - mouse.x;
                    const dy = this.y - mouse.y;
                    const distSq = dx * dx + dy * dy;
                    const influenceRange = MOUSE_INFLUENCE * (this.layer + 1) * 0.45;
                    
                    if (distSq < influenceRange * influenceRange) {
                        const dist = Math.sqrt(distSq);
                        const force = (influenceRange - dist) / influenceRange;
                        const directionalForce = force * 0.28 * mousePolarity;
                        
                        this.vx += (dx / dist) * directionalForce;
                        this.vy += (dy / dist) * directionalForce;
                        
                        if (Math.random() < 0.025) this.spark();
                    }
                }

                this.vx *= 0.975;
                this.vy *= 0.975;

                if (this.x < -100) this.x = width + 100;
                if (this.x > width + 100) this.x = -100;
                if (this.y < -100) this.y = height + 100;
                if (this.y > height + 100) this.y = -100;

                this.phase += this.pulseSpeed;
                
                if (Math.random() < 0.0004 && Date.now() - this.lastPulseTime > 3500) {
                    this.spark();
                }
            }

            spark() {
                this.lastPulseTime = Date.now();
                if (this.connections.length > 0) {
                    const count = Math.min(this.connections.length, 4);
                    for(let i=0; i<count; i++) {
                        const t = this.connections[Math.floor(Math.random() * this.connections.length)];
                        pulses.push(new SignalPulse(this, t));
                    }
                }
            }

            draw() {
                const intensity = 0.4 + Math.sin(this.phase) * 0.6;
                const r = this.radius * (0.85 + intensity * 0.4);
                
                ctx.beginPath();
                ctx.arc(this.x, this.y, r, 0, Math.PI * 2);
                ctx.fillStyle = this.type === 'white' ? colors.cellWhite : colors.cellPink;
                
                ctx.shadowBlur = (this.layer + 1) * 5 * intensity;
                ctx.shadowColor = ctx.fillStyle;
                ctx.fill();
                ctx.shadowBlur = 0;

                if (this.layer === 2) {
                    const aura = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, r * 7);
                    aura.addColorStop(0, this.type === 'white' ? `rgba(255,255,255,${0.12 * intensity})` : `rgba(255,100,200,${0.12 * intensity})`);
                    aura.addColorStop(1, 'transparent');
                    ctx.fillStyle = aura;
                    ctx.fill();
                }
            }
        }

        class SignalPulse {
            constructor(start, end) {
                this.start = start;
                this.end = end;
                this.progress = 0;
                this.speed = 0.007 + Math.random() * 0.015;
            }

            update() {
                this.progress += this.speed;
                return this.progress >= 1;
            }

            draw() {
                const px = this.start.x + (this.end.x - this.start.x) * this.progress;
                const py = this.start.y + (this.end.y - this.start.y) * this.progress;
                
                ctx.beginPath();
                ctx.arc(px, py, 2.5, 0, Math.PI * 2);
                ctx.fillStyle = colors.pulseBlue;
                ctx.shadowBlur = 12;
                ctx.shadowColor = colors.pulseBlue;
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        function initCells() {
            cells = [];
            for (let i = 0; i < CELL_COUNT; i++) {
                cells.push(new Cell());
            }
        }

        function togglePolarity() {
            mousePolarity = Math.random() > 0.5 ? 1 : -1;
            const statusEl = document.getElementById('polarity-status');
            
            if (mousePolarity === 1) {
                statusEl.innerText = "Repulsion";
                statusEl.className = "status-tag text-[9px] uppercase tracking-widest text-pink-400 font-bold";
            } else {
                statusEl.innerText = "Attraction";
                statusEl.className = "status-tag text-[9px] uppercase tracking-widest text-blue-400 font-bold";
            }
        }

        function drawPathways() {
            for (let l = 0; l < 3; l++) {
                ctx.lineWidth = 0.3 + (l * 0.4);
                const layerCells = cells.filter(c => c.layer === l);
                
                layerCells.forEach((a, i) => {
                    a.connections = [];
                    for (let j = i + 1; j < layerCells.length; j++) {
                        const b = layerCells[j];
                        const dx = a.x - b.x;
                        const dy = a.y - b.y;
                        
                        if (Math.abs(dx) < CONNECTION_DISTANCE && Math.abs(dy) < CONNECTION_DISTANCE) {
                            const distSq = dx * dx + dy * dy;
                            // maxDist slightly larger than before to compensate for fewer nodes
                            const maxDist = CONNECTION_DISTANCE * (l * 0.2 + 0.8);

                            if (distSq < maxDist * maxDist) {
                                a.connections.push(b);
                                const dist = Math.sqrt(distSq);
                                const alpha = (1 - dist / maxDist) * (0.07 + l * 0.1);
                                
                                ctx.beginPath();
                                ctx.moveTo(a.x, a.y);
                                const ctrlX = (a.x + b.x) / 2 + Math.cos(a.phase + i) * 25;
                                const ctrlY = (a.y + b.y) / 2 + Math.sin(b.phase + j) * 25;
                                ctx.quadraticCurveTo(ctrlX, ctrlY, b.x, b.y);
                                ctx.strokeStyle = `rgba(80, 140, 255, ${alpha})`;
                                ctx.stroke();
                            }
                        }
                    }
                });
            }
        }

        function animate() {
            ctx.fillStyle = colors.bg;
            ctx.fillRect(0, 0, width, height);

            drawPathways();

            ctx.globalCompositeOperation = 'lighter';
            for (let i = pulses.length - 1; i >= 0; i--) {
                const done = pulses[i].update();
                pulses[i].draw();
                if (done) pulses.splice(i, 1);
            }
            ctx.globalCompositeOperation = 'source-over';

            cells.forEach(cell => {
                cell.update();
                cell.draw();
            });

            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', resize);
        
        const updateMouse = (x, y, active) => {
            mouse.x = x;
            mouse.y = y;
            mouse.active = active;
        };

        window.addEventListener('mousemove', e => updateMouse(e.clientX, e.clientY, true));
        window.addEventListener('mousedown', (e) => {
            mouse.active = true;
            togglePolarity();
        });
        window.addEventListener('mouseleave', () => mouse.active = false);

        window.addEventListener('touchstart', e => {
            updateMouse(e.touches[0].clientX, e.touches[0].clientY, true);
            togglePolarity();
        }, {passive: false});

        window.addEventListener('touchmove', e => {
            updateMouse(e.touches[0].clientX, e.touches[0].clientY, true);
        }, {passive: false});

        window.addEventListener('touchend', () => mouse.active = false);

        resize();
        animate();
        togglePolarity();

    </script>
</body>
</html>
