<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arte Generativa - Lasers Quentes</title>
    <!-- Carregamento do Three.js para renderização 3D -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Carregamento do Tailwind CSS para um layout básico e responsivo -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Estilos para garantir que o canvas ocupe toda a tela */
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000000;
            font-family: 'Inter', sans-serif;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <div id="container" class="w-full h-screen"></div>

    <script>
        // Variáveis globais para a cena 3D
        let scene, camera, renderer, cube, redLineGroup, particleSystem, cubeCamera, gridLines; 
        let stormShapes = []; // Array para as formas da tempestade
        const SHAPE_COUNT = 150; // Número de formas na tempestade
        let mouseX = 0;
        let mouseY = 0;
        const windowHalfX = window.innerWidth / 2;
        const windowHalfY = window.innerHeight / 2;

        // Variáveis para controle de Zoom (Restauradas)
        let targetDistance = 5; 
        const minDistance = 1.5; 
        const maxDistance = 15; 

        // Variáveis para Partículas
        let initialPositions = []; 
        const particleCount = 2000; 

        /**
         * Cria um material wireframe ciano brilhante para as novas formas.
         */
        function createWireframeMaterial() {
            // Material ciano (cyan) brilhante
            return new THREE.MeshBasicMaterial({
                color: 0x55ffff, // Ciano/Azul claro para um visual digital
                wireframe: true,
                transparent: true,
                opacity: 0.9,
            });
        }
        
        /**
         * Cria e adiciona a nuvem de partículas translúcidas.
         */
        function createParticleSystem() {
            const particleGeometry = new THREE.BufferGeometry();
            const positions = [];
            const colors = [];
            const sizes = [];
            
            const spread = 80; 
            const color = new THREE.Color();
            
            for (let i = 0; i < particleCount; i++) {
                const x = THREE.MathUtils.randFloatSpread(spread); 
                const y = THREE.MathUtils.randFloatSpread(spread);
                const z = THREE.MathUtils.randFloatSpread(spread);

                positions.push(x, y, z);
                initialPositions.push(x, y, z); // Armazena a posição original

                color.setHSL(i / particleCount, 1.0, 0.5); 
                colors.push(color.r, color.g, color.b);

                sizes.push(THREE.MathUtils.randFloat(1.0, 5.0));
            }

            particleGeometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            particleGeometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
            particleGeometry.setAttribute('size', new THREE.Float32BufferAttribute(sizes, 1));
            
            const particleMaterial = new THREE.PointsMaterial({
                size: 1, 
                vertexColors: true,
                sizeAttenuation: true, 
                transparent: true,
                opacity: 0.3, // Translucidez para efeito etéreo
                blending: THREE.AdditiveBlending, 
                depthWrite: false
            });

            particleSystem = new THREE.Points(particleGeometry, particleMaterial);
            scene.add(particleSystem);
        }

        /**
         * Cria e adiciona a grelha de linhas vermelhas estilo LASER.
         */
        function createGrid() {
            gridLines = new THREE.Group();
            const lineCount = 30;
            const lineLength = 100;
            const lineThickness = 0.02; // Um pouco mais espesso para o efeito laser

            // Material LASER para a grelha:
            // MeshBasicMaterial ignora luzes (brilha sozinho)
            // AdditiveBlending faz as cores se somarem, criando um efeito de luz pura
            const lineMaterial = new THREE.MeshBasicMaterial({
                color: 0xff0000,          
                transparent: true,
                opacity: 0.4,           // Translúcido para sobreposição
                blending: THREE.AdditiveBlending,
                side: THREE.DoubleSide
            });

            // Linhas convergindo (X e Y)
            for (let i = 1; i <= lineCount; i++) {
                const spacing = i * 0.25;
                
                // Linhas X (Horizontal)
                let lineRightGeometry = new THREE.BoxGeometry(lineThickness, lineThickness, lineLength * 2);
                let lineRight = new THREE.Mesh(lineRightGeometry, lineMaterial);
                lineRight.position.set(spacing, 0, 0);
                gridLines.add(lineRight);

                let lineLeftGeometry = new THREE.BoxGeometry(lineThickness, lineThickness, lineLength * 2);
                let lineLeft = new THREE.Mesh(lineLeftGeometry, lineMaterial);
                lineLeft.position.set(-spacing, 0, 0);
                gridLines.add(lineLeft);

                // Linhas Y (Vertical)
                let lineUpGeometry = new THREE.BoxGeometry(lineLength * 2, lineThickness, lineThickness);
                let lineUp = new THREE.Mesh(lineUpGeometry, lineMaterial);
                lineUp.position.set(0, spacing, 0);
                gridLines.add(lineUp);

                let lineDownGeometry = new THREE.BoxGeometry(lineLength * 2, lineThickness, lineThickness);
                let lineDown = new THREE.Mesh(lineDownGeometry, lineMaterial);
                lineDown.position.set(0, -spacing, 0);
                gridLines.add(lineDown);
            }

            scene.add(gridLines);
        }
        
        /**
         * Cria e posiciona uma forma 3D aleatória no espaço da tempestade.
         */
        function createStormShape() {
            // Geometrias disponíveis: Cubo, Pirâmide (Cone com 4 segmentos) e Cilindro
            const geometries = [
                new THREE.BoxGeometry(1, 1, 1),
                new THREE.ConeGeometry(0.7, 1.5, 4), 
                new THREE.CylinderGeometry(0.7, 0.7, 1.5, 12), 
            ];
            
            // Escolhe uma geometria aleatória
            const geometry = geometries[Math.floor(Math.random() * geometries.length)];
            
            // Cria o material wireframe ciano
            const material = createWireframeMaterial();

            const mesh = new THREE.Mesh(geometry, material);
            
            const scale = THREE.MathUtils.randFloat(0.5, 2.0);
            mesh.scale.set(scale, scale, scale);

            // Spawna a forma longe do centro
            const radius = 50;
            mesh.position.set(
                THREE.MathUtils.randFloatSpread(radius * 2), 
                THREE.MathUtils.randFloatSpread(radius * 2), 
                THREE.MathUtils.randFloatSpread(radius * 2)
            );

            // Define a velocidade e rotação aleatória para o movimento da tempestade
            mesh.userData.velocity = new THREE.Vector3(
                THREE.MathUtils.randFloatSpread(0.2), // Velocidade aumentada para mais dinamismo
                THREE.MathUtils.randFloatSpread(0.2),
                THREE.MathUtils.randFloatSpread(0.2)
            );
            mesh.userData.rotationSpeed = new THREE.Vector3(
                THREE.MathUtils.randFloatSpread(0.02),
                THREE.MathUtils.randFloatSpread(0.02),
                THREE.MathUtils.randFloatSpread(0.02)
            );
            
            // Adiciona a forma à cena e à lista
            scene.add(mesh);
            stormShapes.push(mesh);
        }
        
        /**
         * Lógica de reciclagem da forma. Reposiciona a forma fora da vista da câmera.
         * @param {THREE.Mesh} mesh - A forma a ser reciclada.
         */
        function recycleShape(mesh) {
            const radius = 50;
            // Reposiciona a forma longe do centro (como se estivesse "entrando" na tempestade novamente)
            mesh.position.set(
                THREE.MathUtils.randFloatSpread(radius * 2), 
                THREE.MathUtils.randFloatSpread(radius * 2), 
                THREE.MathUtils.randFloatSpread(radius * 2)
            );
            
            // Redefine a escala e rotação
            const scale = THREE.MathUtils.randFloat(0.5, 2.0);
            mesh.scale.set(scale, scale, scale);
            
            // Redefine a velocidade
            mesh.userData.velocity.set(
                THREE.MathUtils.randFloatSpread(0.2),
                THREE.MathUtils.randFloatSpread(0.2),
                THREE.MathUtils.randFloatSpread(0.2)
            );
        }

        /**
         * Inicializa a cena, câmera e objetos.
         */
        function init() {
            const container = document.getElementById('container');

            // 1. CENA (Fundo Negro)
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000); // Fundo negro

            // 2. CÂMERA (Volta à visão de "chão" com altura 1.5)
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.5, targetDistance); 
            camera.lookAt(0, 0, 0);

            // 3. RENDERIZADOR
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);
            
            // 4a. CÂMERA DE CUBO (Para reflexão no cubo)
            const cubeRenderTarget = new THREE.WebGLCubeRenderTarget(256, {
                format: THREE.RGBFormat,
                generateMipmaps: true,
                minFilter: THREE.LinearMipmapLinearFilter
            });
            cubeCamera = new THREE.CubeCamera(0.1, 100, cubeRenderTarget); 
            scene.add(cubeCamera);

            // 4b. O CUBO ESPELHADO (Branco)
            const geometry = new THREE.BoxGeometry(1.5, 1.5, 1.5);
            const material = new THREE.MeshStandardMaterial({
                color: 0xffffff,          // Branco
                metalness: 1.0,           
                roughness: 0.0,           
                emissive: 0x000000,       
                envMap: cubeCamera.renderTarget.texture 
            });

            cube = new THREE.Mesh(geometry, material);
            cube.position.y = 0.75; 
            scene.add(cube);
            cubeCamera.position.copy(cube.position); 

            // 4c. LINHA DE HORIZONTE LASER (Core + Glow)
            redLineGroup = new THREE.Group();
            redLineGroup.position.y = 0;
            scene.add(redLineGroup);

            // 1. Núcleo Branco (O "hotspot" do laser)
            const coreGeometry = new THREE.CylinderGeometry(0.015, 0.015, 300, 32);
            coreGeometry.rotateZ(Math.PI / 2);
            const coreMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff });
            const coreMesh = new THREE.Mesh(coreGeometry, coreMaterial);
            redLineGroup.add(coreMesh);

            // 2. Halo Vermelho (O brilho ao redor)
            const glowGeometry = new THREE.CylinderGeometry(0.15, 0.15, 300, 32);
            glowGeometry.rotateZ(Math.PI / 2);
            const glowMaterial = new THREE.MeshBasicMaterial({
                color: 0xff0000,
                transparent: true,
                opacity: 0.3,
                blending: THREE.AdditiveBlending,
                side: THREE.FrontSide
            });
            const glowMesh = new THREE.Mesh(glowGeometry, glowMaterial);
            redLineGroup.add(glowMesh);
            
            // 5. GRELHA DE LINHAS LASER
            createGrid();

            // 6. SISTEMA DE PARTÍCULAS
            createParticleSystem();

            // 7. CRIAÇÃO DA TEMPESTADE DE FORMAS (Ciano)
            for (let i = 0; i < SHAPE_COUNT; i++) {
                createStormShape();
            }

            // 8. ILUMINAÇÃO (Atualizada para tons quentes)
            // Nota: MeshBasicMaterial (Lasers) ignoram isso, mas o Cubo e as partículas são afetados
            const hemiLight = new THREE.HemisphereLight(0xffaa77, 0x442211, 1.0);
            hemiLight.position.set(0, 20, 0);
            scene.add(hemiLight);

            const keyLight = new THREE.DirectionalLight(0xffddaa, 1.5);
            keyLight.position.set(5, 10, 5);
            scene.add(keyLight);

            const fillLight = new THREE.DirectionalLight(0xff7744, 0.8); 
            fillLight.position.set(-5, -10, -5);
            scene.add(fillLight);
            
            // Listeners
            document.addEventListener('mousemove', onDocumentMouseMove, false);
            document.addEventListener('wheel', onDocumentMouseWheel, false); 
            window.addEventListener('resize', onWindowResize, false);
        }

        /**
         * Lógica de responsividade da janela.
         */
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        /**
         * Lógica de movimento do mouse (Rotacionar espaço).
         */
        function onDocumentMouseMove(event) {
            // Movimento mais controlado para a perspectiva de "chão"
            mouseX = (event.clientX - windowHalfX) / 100;
            mouseY = (event.clientY - windowHalfY) / 100;
        }

        /**
         * Lógica de zoom do mouse wheel (Restaurada).
         */
        function onDocumentMouseWheel(event) {
            event.preventDefault();
            
            // Ajusta a distância alvo com base no scroll
            targetDistance -= event.deltaY * 0.005;
            
            // Limita a distância alvo (clamp)
            targetDistance = Math.max(minDistance, Math.min(maxDistance, targetDistance));
        }

        /**
         * Loop de animação (Generativa e Interativa).
         */
        function animate() {
            requestAnimationFrame(animate);

            const time = Date.now() * 0.0005;

            // 1. ATUALIZAÇÃO DA REFLEXÃO ESPELHADA (CubeCamera)
            if (cubeCamera) {
                cube.visible = false;
                cubeCamera.update(renderer, scene);
                cube.visible = true;
            }

            // 2. ANIMAÇÃO GENERATIVA
            cube.rotation.x = time * 0.7;
            cube.rotation.y = time * 0.9;
            gridLines.rotation.y = time * 0.1; // Rotação da grelha

            // 3. MOVIMENTO ESPIRALADO DAS PARTÍCULAS
            const particlePositions = particleSystem.geometry.attributes.position.array;
            for (let i = 0; i < particleCount * 3; i += 3) {
                const originalX = initialPositions[i];
                const originalY = initialPositions[i + 1];
                const originalZ = initialPositions[i + 2];
                const angle = time * 0.5 + (i / 3) * 0.01; 
                const radius = Math.sqrt(originalX * originalX + originalZ * originalZ);
                particlePositions[i] = radius * Math.cos(angle);
                particlePositions[i + 2] = radius * Math.sin(angle);
                particlePositions[i + 1] = originalY + Math.sin(time * 2.0 + (i/3) * 0.5) * 0.5;
            }
            particleSystem.geometry.attributes.position.needsUpdate = true;

            // 4. ANIMAÇÃO E MOVIMENTO DA TEMPESTADE DE FORMAS
            const boundary = 100;

            stormShapes.forEach(mesh => {
                // Atualiza a posição da forma (movimento)
                mesh.position.add(mesh.userData.velocity);

                // Atualiza a rotação da forma
                mesh.rotation.x += mesh.userData.rotationSpeed.x;
                mesh.rotation.y += mesh.userData.rotationSpeed.y;
                mesh.rotation.z += mesh.userData.rotationSpeed.z;

                // RECICLAGEM
                if (Math.abs(mesh.position.x) > boundary || 
                    Math.abs(mesh.position.y) > boundary || 
                    Math.abs(mesh.position.z) > boundary) 
                {
                    recycleShape(mesh);
                }
                
                // Diminui a opacidade à medida que a forma se afasta
                const distance = mesh.position.length();
                mesh.material.opacity = Math.max(0.1, 1.0 - distance / boundary);
            });
            

            // 5. INTERATIVIDADE DA CÂMERA
            
            // ZOOM SUAVE
            camera.position.z += (targetDistance - camera.position.z) * 0.1; 
            
            // ROTAÇÃO DO ESPAÇO
            camera.position.x += (mouseX - camera.position.x) * 0.05;
            camera.position.y += (-mouseY - camera.position.y + 1.5) * 0.05;
            
            camera.lookAt(cube.position); 

            renderer.render(scene, camera);
        }

        // Inicia a aplicação quando a janela carregar
        window.onload = function() {
            init();
            animate();
        };

    </script>
</body>
</html>
