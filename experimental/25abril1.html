<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cravo Pixel Sorting Glitch Intensificado</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
        }

        /* --- FUNDO DE TIRAS COM SOBREPOSIÇÃO E PIXEL SORTING --- */
        .background-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            overflow: hidden;
            filter: contrast(200%) brightness(130%);
        }

        .stripe {
            position: absolute;
            top: -20%;
            height: 140%;
            width: 25vw;
            mix-blend-mode: screen;
            opacity: 0.95;
            animation: scaleVertical 3s ease-in-out infinite alternate, pixelSort 0.15s steps(8) infinite;
        }

        @keyframes pixelSort {
            0% { clip-path: inset(0 0 0 0); transform: translateY(0); }
            25% { clip-path: inset(5% 0 60% 0); transform: translateY(10px) skewX(2deg); }
            50% { clip-path: inset(40% 0 10% 0); transform: translateY(-15px) skewX(-2deg); }
            75% { clip-path: inset(20% 0 20% 0); transform: translateY(20px); }
            100% { clip-path: inset(0 0 0 0); transform: translateY(0); }
        }

        @keyframes scaleVertical {
            0% { transform: scaleY(0.5) translateX(-20px); }
            100% { transform: scaleY(1.2) translateX(20px); }
        }

        /* Paleta de Tons: Vermelhos e Brancos */
        .s1 { left: -5vw;  background: linear-gradient(to bottom, #4a0000, #ff0000, #8b0000); animation-duration: 4s; }
        .s2 { left: 15vw; background: linear-gradient(to bottom, #ffffff, #f0f0f0, #cccccc); animation-duration: 6s; animation-delay: -1s; }
        .s3 { left: 30vw; background: linear-gradient(to bottom, #cc0000, #ff3333, #660000); animation-duration: 5s; animation-delay: -2.5s; }
        
        /* Tira Central de Contraste */
        .s-center { 
            left: 37.5vw; 
            width: 30vw; 
            background: linear-gradient(to bottom, #ffffff, #ffffff, #eeeeee); 
            animation-duration: 4.5s; 
            z-index: 2;
            box-shadow: 0 0 80px rgba(255,255,255,0.3);
        }

        .s4 { left: 60vw; background: linear-gradient(to bottom, #ff4d4d, #990000, #ff0000); animation-duration: 7s; animation-delay: -3.2s; }
        .s5 { left: 78vw; background: #ffffff; animation-duration: 5.5s; animation-delay: -4.8s; }
        .s6 { left: 90vw; background: linear-gradient(to bottom, #330000, #cc0000); animation-duration: 8s; animation-delay: -0.5s; }

        /* --- LINHAS DE VARRIMENTO INTENSIFICADAS --- */
        .glitch-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            /* Camada de scanlines estáticas densas */
            background: repeating-linear-gradient(
                0deg,
                rgba(255, 255, 255, 0.05) 0px,
                rgba(255, 255, 255, 0.05) 1px,
                transparent 1px,
                transparent 3px
            );
            pointer-events: none;
            z-index: 5;
        }

        /* Linha de varrimento móvel (Vínculo Visual) */
        .scan-bar {
            position: absolute;
            width: 100%;
            height: 10px;
            background: rgba(255, 0, 0, 0.2);
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
            top: -10px;
            z-index: 6;
            animation: moveScan 4s linear infinite;
        }

        /* Ruído cromático aleatório */
        .noise {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.08;
            pointer-events: none;
            z-index: 7;
        }

        @keyframes moveScan {
            0% { top: -10%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 110%; opacity: 0; }
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        #ui-container {
            position: absolute;
            bottom: 30px;
            width: 100%;
            text-align: center;
            pointer-events: none;
            text-shadow: 0 0 15px rgba(255,0,0,0.8);
            z-index: 10;
        }
        h1 { margin: 0; font-size: 1.4rem; letter-spacing: 8px; font-weight: 300; text-transform: uppercase; color: #fff; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div class="background-container">
        <div class="stripe s1"></div>
        <div class="stripe s2"></div>
        <div class="stripe s3"></div>
        <div class="stripe s-center"></div>
        <div class="stripe s4"></div>
        <div class="stripe s5"></div>
        <div class="stripe s6"></div>
        <div class="glitch-overlay"></div>
        <div class="scan-bar"></div>
        <div class="noise"></div>
    </div>

    <div id="ui-container">
        <h1>Varrimento / Abril</h1>
    </div>

    <script>
        let scene, camera, renderer, controls, flowerGroup;
        let clock = new THREE.Clock();

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1, 8);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 1.5;

            flowerGroup = new THREE.Group();

            // Material do Cravo (Vermelho Intenso)
            const redMaterial = new THREE.MeshBasicMaterial({ 
                color: 0xff0000, 
                wireframe: true, 
                transparent: true, 
                opacity: 0.7 
            });
            const greenMaterial = new THREE.MeshBasicMaterial({ 
                color: 0x00ff44, 
                wireframe: true, 
                transparent: true, 
                opacity: 0.9 
            });

            // Estrutura do Caule
            const stemGeom = new THREE.CylinderGeometry(0.06, 0.1, 8, 8, 20);
            const stem = new THREE.Mesh(stemGeom, greenMaterial);
            stem.position.y = -4;
            flowerGroup.add(stem);

            // Cálice Detalhado
            const calyxGeom = new THREE.CylinderGeometry(0.5, 0.15, 1.2, 12);
            const calyx = new THREE.Mesh(calyxGeom, greenMaterial);
            calyx.position.y = 0.2;
            flowerGroup.add(calyx);

            // Pétalas Realistas com Bordas Picotadas
            const petalsGroup = new THREE.Group();
            petalsGroup.position.y = 0.8;

            const numPetals = 220;
            for (let i = 0; i < numPetals; i++) {
                const layer = i / numPetals;
                const radius = 0.7 + Math.random() * 1.0;
                const petalGeom = new THREE.CircleGeometry(radius, 24);
                
                const pos = petalGeom.attributes.position;
                for (let j = 1; j < pos.count; j++) {
                    const x = pos.getX(j);
                    const y = pos.getY(j);
                    const angle = Math.atan2(y, x);
                    const dist = Math.sqrt(x*x + y*y);
                    
                    const jitter = Math.sin(angle * 35) * 0.15 * (dist/radius);
                    pos.setXY(j, Math.cos(angle) * (dist + jitter), Math.sin(angle) * (dist + jitter));
                    pos.setZ(j, Math.sin(angle * 4) * 0.4 + (Math.random() - 0.5) * 0.25);
                }

                const petal = new THREE.Mesh(petalGeom, redMaterial);
                const phi = Math.acos( 1 - layer ); 
                const theta = Math.sqrt( numPetals * Math.PI ) * phi;

                petal.position.set(
                    Math.cos(theta) * Math.sin(phi) * 0.6,
                    Math.cos(phi) * 0.5,
                    Math.sin(theta) * Math.sin(phi) * 0.6
                );

                petal.lookAt(0, petal.position.y - 1.2, 0);
                petal.rotation.z += Math.random() * Math.PI;
                petalsGroup.add(petal);
            }
            flowerGroup.add(petalsGroup);

            scene.add(flowerGroup);
            window.addEventListener('resize', onWindowResize, false);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();
            
            flowerGroup.position.y = Math.sin(time * 1.8) * 0.25;
            flowerGroup.rotation.y = Math.sin(time * 0.4) * 0.15;

            controls.update();
            renderer.render(scene, camera);
        }

        window.onload = () => { init(); animate(); };
    </script>
</body>
</html>
